<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#007aff"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Shift+"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <title>Shift+</title>


  <!-- =====================================================
       ログイン画面用CSS
       ===================================================== -->

  <style>

    /* -----------------------------------------------------
       ログイン画面全体
       ----------------------------------------------------- */

    #loginPage {

      position: fixed;

      inset: 0;

      width: 100%;

      height: 100dvh;

      min-height: 100svh;

      max-height: 100dvh;

      z-index: 99999;

      display: flex;

      justify-content: center;

      align-items: center;

      box-sizing: border-box;

      padding:
        max(10px, env(safe-area-inset-top))
        12px
        max(10px, env(safe-area-inset-bottom))
        12px;

      overflow: hidden;

      overscroll-behavior: none;

      touch-action: none;

      background: #f5f7fb;

    }


    /* -----------------------------------------------------
       ログインカード
       ----------------------------------------------------- */

    #loginPage > div {

      width: 100%;

      max-width: 390px;

      max-height: calc(
        100dvh
        - env(safe-area-inset-top)
        - env(safe-area-inset-bottom)
        - 20px
      );

      box-sizing: border-box;

      padding: 16px 18px 12px;

      overflow: hidden;

      border-radius: 22px;

      background: #ffffff;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.10);

    }


    /* -----------------------------------------------------
       Shift+ ロゴ
       ----------------------------------------------------- */

    .login-logo {

      width: 100%;

      display: flex;

      justify-content: center;

      align-items: center;

      margin: 0 0 12px;

      flex-shrink: 0;

    }


    .login-logo img {

      display: block;

      width: min(220px, 65vw);

      max-height: 90px;

      height: auto;

      object-fit: contain;

    }


    /* -----------------------------------------------------
       ログインタイトル
       ----------------------------------------------------- */

    .login-subtitle {

      margin: 0 0 12px;

      text-align: center;

      color: #6b7280;

      font-size: 13px;

      line-height: 1.4;

    }


    /* -----------------------------------------------------
       ログイン入力
       ----------------------------------------------------- */

    #loginPage input[type="email"],
    #loginPage input[type="password"],
    #loginPage input[type="text"] {

      width: 100%;

      box-sizing: border-box;

      height: 44px;

      padding: 0 13px;

      border: 1px solid #d8dde6;

      border-radius: 10px;

      background: #ffffff;

      color: #222222;

      font-size: 15px;

      outline: none;

    }


    #loginPage input:focus {

      border-color: #007aff;

      box-shadow:
        0 0 0 3px rgba(0, 122, 255, 0.10);

    }


    /* -----------------------------------------------------
       パスワード入力
       ----------------------------------------------------- */

    .password-input-wrapper {

      position: relative;

      width: 100%;

      margin-top: 8px;

    }


    .password-input-wrapper input {

      padding-right: 48px !important;

    }


    #togglePasswordButton {

      position: absolute;

      right: 8px;

      top: 50%;

      transform: translateY(-50%);

      width: 34px;

      height: 34px;

      border: none;

      background: transparent;

      color: #777;

      cursor: pointer;

      font-size: 17px;

    }


    /* -----------------------------------------------------
       ログイン情報保持
       ----------------------------------------------------- */

    .login-options {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 8px;

      margin-top: 9px;

      font-size: 12px;

    }


    .remember-login {

      display: flex;

      align-items: center;

      gap: 5px;

      color: #555;

    }


    .remember-login input {

      width: 15px;

      height: 15px;

      margin: 0;

    }


    #forgotPasswordButton {

      border: none;

      padding: 0;

      background: none;

      color: #007aff;

      font-size: 12px;

      cursor: pointer;

    }


    /* -----------------------------------------------------
       メインログインボタン
       ----------------------------------------------------- */

    #emailLoginButton {

      width: 100%;

      height: 44px;

      margin-top: 12px;

      border: none;

      border-radius: 10px;

      background: #007aff;

      color: #ffffff;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;

    }


    /* -----------------------------------------------------
       区切り
       ----------------------------------------------------- */

    .login-divider {

      display: flex;

      align-items: center;

      gap: 10px;

      margin: 13px 0 10px;

      color: #9ca3af;

      font-size: 11px;

    }


    .login-divider::before,
    .login-divider::after {

      content: "";

      flex: 1;

      height: 1px;

      background: #e5e7eb;

    }


    /* -----------------------------------------------------
       外部ログイン
       ----------------------------------------------------- */

    .social-login-buttons {

      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 7px;

    }


    .social-login-buttons button {

      height: 40px;

      border: 1px solid #e0e4ea;

      border-radius: 9px;

      background: #ffffff;

      color: #333333;

      font-size: 13px;

      cursor: pointer;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 6px;

    }


    #googleLoginButton {

      color: #333333;

    }


    /* -----------------------------------------------------
       Passkey
       ----------------------------------------------------- */

    #passkeyLoginButton {

      width: 100%;

      height: 40px;

      margin-top: 7px;

      border: 1px solid #d8dde6;

      border-radius: 9px;

      background: #f8f9fb;

      color: #333333;

      font-size: 13px;

      cursor: pointer;

    }


    /* -----------------------------------------------------
       新規職場
       ----------------------------------------------------- */

    #newOrganizationButton {

      width: 100%;

      height: 38px;

      margin-top: 9px;

      border: none;

      background: transparent;

      color: #007aff;

      font-size: 12px;

      cursor: pointer;

    }


    /* -----------------------------------------------------
       新規職場フォーム
       ----------------------------------------------------- */

    #newOrganizationForm {

      margin-top: 5px;

    }


    #newOrganizationForm input {

      margin-bottom: 7px;

    }


    #createOrganizationButton {

      width: 100%;

      height: 42px;

      border: none;

      border-radius: 9px;

      background: #007aff;

      color: #ffffff;

      font-size: 14px;

      font-weight: 600;

    }


    #cancelOrganizationButton {

      width: 100%;

      height: 34px;

      margin-top: 5px;

      border: none;

      background: transparent;

      color: #666;

      font-size: 12px;

    }


    /* -----------------------------------------------------
       ログインメッセージ
       ----------------------------------------------------- */

    #loginMessage {

      min-height: 18px;

      margin-top: 7px;

      text-align: center;

      color: #666;

      font-size: 11px;

      line-height: 1.4;

    }


    /* -----------------------------------------------------
       小さい画面
       ----------------------------------------------------- */

    @media (max-height: 700px) {

      #loginPage > div {

        padding-top: 11px;

        padding-bottom: 8px;

      }


      .login-logo {

        margin-bottom: 7px;

      }


      .login-logo img {

        width: 175px;

        max-height: 65px;

      }


      #emailLoginButton {

        margin-top: 8px;

      }


      .login-divider {

        margin: 9px 0 7px;

      }

    }


    @media (max-height: 620px) {

      #loginPage > div {

        padding:
          8px
          15px
          6px;

        border-radius: 18px;

      }


      .login-logo img {

        width: 150px;

        max-height: 55px;

      }


      .login-subtitle {

        margin-bottom: 7px;

        font-size: 11px;

      }


      #loginPage input[type="email"],
      #loginPage input[type="password"],
      #loginPage input[type="text"] {

        height: 39px;

        font-size: 13px;

      }


      #emailLoginButton {

        height: 39px;

      }


      .social-login-buttons button,
      #passkeyLoginButton {

        height: 35px;

      }


      #newOrganizationButton {

        height: 31px;

      }

    }


    /* -----------------------------------------------------
       ダークモード
       ----------------------------------------------------- */

    body.dark-mode #loginPage {

      background: #111827;

    }


    body.dark-mode #loginPage > div {

      background: #1f2937;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.35);

    }


    body.dark-mode .login-subtitle {

      color: #aeb7c5;

    }


    body.dark-mode #loginPage input[type="email"],
    body.dark-mode #loginPage input[type="password"],
    body.dark-mode #loginPage input[type="text"] {

      background: #111827;

      border-color: #374151;

      color: #ffffff;

    }


    body.dark-mode .remember-login {

      color: #d1d5db;

    }


    body.dark-mode .login-divider {

      color: #9ca3af;

    }


    body.dark-mode .login-divider::before,
    body.dark-mode .login-divider::after {

      background: #374151;

    }


    body.dark-mode .social-login-buttons button,
    body.dark-mode #passkeyLoginButton {

      background: #111827;

      border-color: #374151;

      color: #ffffff;

    }

  </style>


  <!-- Supabase -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"
  ></script>

</head>


<body>


  <!-- =====================================================
       ログイン画面
       ===================================================== -->

  <section
    id="loginPage"
  >

    <div>


      <!-- Shift+ ロゴ -->

      <div class="login-logo">

        <img
          src="icon/shift-plus-logo.png"
          alt="Shift+"
        >

      </div>


      <p class="login-subtitle">
        職場の勤務を、もっとシンプルに
      </p>


      <!-- =================================================
           通常ログイン
           ================================================= -->

      <div id="loginMainView">


        <input
          type="email"
          id="emailLoginInput"
          placeholder="メールアドレス"
          autocomplete="email"
        >


        <div class="password-input-wrapper">

          <input
            type="password"
            id="passwordLoginInput"
            placeholder="パスワード"
            autocomplete="current-password"
          >

          <button
            type="button"
            id="togglePasswordButton"
            aria-label="パスワードを表示"
          >
            👁
          </button>

        </div>


        <div class="login-options">

          <label class="remember-login">

            <input
              type="checkbox"
              id="rememberLoginCheckbox"
            >

            <span>
              ログイン情報を保持する
            </span>

          </label>


          <button
            type="button"
            id="forgotPasswordButton"
          >
            パスワードを忘れた方
          </button>

        </div>


        <button
          type="button"
          id="emailLoginButton"
        >
          ログイン
        </button>


        <!-- 区切り -->

        <div class="login-divider">
          その他のログイン
        </div>


        <!-- =================================================
             外部ログイン
             ================================================= -->

        <div class="social-login-buttons">


          <button
            type="button"
            id="googleLoginButton"
          >
            <span>G</span>
            Google
          </button>


          <button
            type="button"
            id="yahooLoginButton"
          >
            <span>Y!</span>
            Yahoo
          </button>


          <button
            type="button"
            id="facebookLoginButton"
          >
            <span>f</span>
            Facebook
          </button>


          <button
            type="button"
            id="lineLoginButton"
          >
            <span>LINE</span>
            LINE
          </button>


          <button
            type="button"
            id="appleLoginButton"
          >
            <span></span>
            Apple
          </button>


        </div>


        <!-- Passkey -->

        <button
          type="button"
          id="passkeyLoginButton"
        >
          🔐 Face ID / 指紋でログイン
        </button>


        <!-- 新規職場 -->

        <button
          type="button"
          id="newOrganizationButton"
        >
          ＋ 新しい職場を登録
        </button>


      </div>


      <!-- =================================================
           新規職場登録フォーム
           ================================================= -->

      <div
        id="newOrganizationForm"
        style="display:none;"
      >


        <input
          type="text"
          id="organizationNameInput"
          placeholder="職場名"
        >


        <input
          type="text"
          id="organizationStaffNameInput"
          placeholder="あなたの名前"
        >


        <button
          type="button"
          id="createOrganizationButton"
        >
          職場を作成
        </button>


        <button
          type="button"
          id="cancelOrganizationButton"
        >
          キャンセル
        </button>


      </div>


      <!-- メッセージ -->

      <div
        id="loginMessage"
      ></div>


    </div>

  </section>



  <!-- =====================================================
       アプリ本体
       ===================================================== -->

  <div
    id="app"
    style="display:none;"
  >


    <!-- ===================================================
         ヘッダー
         =================================================== -->

    <header
      class="app-header"
    >

      <div
        id="organizationTitle"
      >
        Shift+
      </div>


      <div
        class="header-actions"
      >

        <button
          type="button"
          id="deleteMonthButton"
        >
          月削除
        </button>


        <button
          type="button"
          id="logoutButton"
        >
          ログアウト
        </button>


        <button
          type="button"
          id="darkModeButton"
          aria-label="ダークモード"
          title="ダークモード"
        >

          <svg
            class="dark-mode-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5
                 A8.5 8.5 0 1 0 20.5 15.5Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

          </svg>

        </button>

      </div>

    </header>



    <!-- ===================================================
         ナビゲーション
         =================================================== -->

    <nav
      class="bottom-nav"
    >

      <button
        type="button"
        id="scheduleNavButton"
        onclick="showPage('schedulePage')"
      >
        勤務表
      </button>


      <button
        type="button"
        id="staffNavButton"
        onclick="showPage('staffPage')"
      >
        職員
      </button>


      <button
        type="button"
        id="leaveNavButton"
        onclick="showPage('leavePage')"
      >
        休暇
      </button>


      <button
        type="button"
        id="shiftNavButton"
        onclick="showPage('shiftPage')"
      >
        勤務形態
      </button>


      <button
        type="button"
        id="holidayNavButton"
        onclick="showPage('holidayPage')"
      >
        休日
      </button>

    </nav>



    <!-- ===================================================
         勤務表
         =================================================== -->

    <main
      id="schedulePage"
      class="page"
    >


      <div
        class="month-navigation"
      >

        <button
          type="button"
          id="prevMonth"
        >
          ‹
        </button>


        <div
          id="currentMonthLabel"
        ></div>


        <button
          type="button"
          id="nextMonth"
        >
          ›
        </button>

      </div>


      <div
        class="table-wrapper"
      >

        <table
          id="scheduleTable"
        >

          <!-- JavaScriptで生成 -->

        </table>

      </div>


    </main>



    <!-- ===================================================
         職員管理
         =================================================== -->

    <section
      id="staffPage"
      class="page"
      style="display:none;"
    >

      <div
        class="settings-card"
      >

        <h2>
          職員管理
        </h2>


        <div
          class="input-row"
        >

          <input
            type="text"
            id="staffNameInput"
            placeholder="職員名"
          >


          <button
            type="button"
            id="addStaffButton"
          >
            追加
          </button>

        </div>


        <div
          id="staffCount"
        >
        </div>


        <div
          id="staffList"
          class="list"
        >
        </div>


        <div
          id="organizationDangerZone"
          style="display:none;"
        >

          <hr>


          <button
            type="button"
            id="deleteOrganizationButton"
          >
            職場を削除
          </button>

        </div>

      </div>

    </section>



    <!-- ===================================================
         休暇管理
         =================================================== -->

    <section
      id="leavePage"
      class="page"
      style="display:none;"
    >

      <div
        class="settings-card"
      >

        <h2>
          休暇設定
        </h2>


        <div
          class="input-row"
        >

          <input
            type="text"
            id="leaveNameInput"
            placeholder="休暇名"
          >


          <input
            type="color"
            id="leaveColorInput"
            value="#ff6b6b"
          >


          <button
            type="button"
            id="addLeaveButton"
          >
            追加
          </button>

        </div>


        <div
          id="leaveList"
          class="list"
        >
        </div>

      </div>

    </section>



    <!-- ===================================================
         勤務形態
         =================================================== -->

    <section
      id="shiftPage"
      class="page"
      style="display:none;"
    >

      <div
        class="settings-card"
      >

        <h2>
          勤務形態
        </h2>


        <div
          class="input-row"
        >

          <input
            type="text"
            id="shiftNameInput"
            placeholder="勤務名"
          >


          <input
            type="time"
            id="shiftStartInput"
          >


          <input
            type="time"
            id="shiftEndInput"
          >


          <input
            type="number"
            id="shiftBreakInput"
            placeholder="休憩"
            min="0"
          >


          <button
            type="button"
            id="addShiftButton"
          >
            追加
          </button>

        </div>


        <div
          id="shiftList"
          class="list"
        >
        </div>


        <hr>


        <h3>
          明け時間
        </h3>


        <div
          class="input-row"
        >

          <input
            type="time"
            id="akeStartInput"
          >


          <input
            type="time"
            id="akeEndInput"
          >


          <button
            type="button"
            id="saveAkeTimeButton"
          >
            保存
          </button>

        </div>

      </div>

    </section>



    <!-- ===================================================
         会社休日
         =================================================== -->

    <section
      id="holidayPage"
      class="page"
      style="display:none;"
    >

      <div
        class="settings-card"
      >

        <h2>
          会社休日
        </h2>


        <div
          class="input-row"
        >

          <input
            type="text"
            id="companyHolidayName"
            placeholder="休日名"
          >


          <input
            type="date"
            id="companyHolidayStart"
          >


          <input
            type="date"
            id="companyHolidayEnd"
          >


          <button
            type="button"
            id="addCompanyHolidayButton"
          >
            追加
          </button>

        </div>


        <div
          id="companyHolidayList"
          class="list"
        >
        </div>

      </div>

    </section>



    <!-- ===================================================
         勤務シフトメニュー
         =================================================== -->

    <div
      id="shiftMenu"
      style="display:none;"
    >

      <div
        id="shiftMenuButtons"
      >
      </div>

    </div>



    <!-- ===================================================
         カレンダー確認
         =================================================== -->

    <div
      id="calendarConfirm"
      style="display:none;"
    >

      <div>

        <h3
          id="calendarConfirmTitle"
        >
        </h3>


        <p
          id="calendarConfirmText"
        >
        </p>


        <button
          type="button"
          id="calendarCancelButton"
        >
          キャンセル
        </button>


        <button
          type="button"
          id="calendarOKButton"
        >
          OK
        </button>

      </div>

    </div>


  </div>



  <!-- =====================================================
       JavaScript
       ===================================================== -->

  <script
    src="script.js?v=20260927"
  ></script>


  <!-- =====================================================
       Service Worker
       ===================================================== -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function() {

          navigator.serviceWorker
            .register("./service-worker.js")
            .catch(
              function(error) {

                console.error(
                  "Service Worker登録エラー:",
                  error
                );

              }
            );

        }
      );

    }

  </script>


</body>

</html>
