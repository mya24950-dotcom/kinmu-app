<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="勤務表"
  >

  <meta
    name="theme-color"
    content="#007aff"
  >

  <title>勤務表</title>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"
  ></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Arial,
        sans-serif;

      background: #f2f2f7;
      color: #1c1c1e;

      overflow-y: auto;
      touch-action: pan-y;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* =================================================
       ログイン画面
    ================================================= */

    #loginPage {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
      background: #f2f2f7;
    }

    #loginPage > div {
      width: 100%;
      max-width: 420px;

      background: #ffffff;
      border-radius: 20px;

      padding: 32px 24px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.08);
    }

    #googleLoginButton {
      width: 100%;
      min-height: 52px;

      border: 1px solid #d1d1d6;
      border-radius: 12px;

      background: #ffffff;
      color: #1c1c1e;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    #newOrganizationButton {
      width: 100%;
      min-height: 52px;

      border: none;
      border-radius: 12px;

      background: #007aff;
      color: #ffffff;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      box-sizing: border-box;
    }

    /* =================================================
       アプリ本体
    ================================================= */

    #app {
      min-height: 100vh;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: #ffffff;

      border-bottom: 1px solid #d1d1d6;

      padding:
        calc(env(safe-area-inset-top) + 10px)
        12px
        10px;
    }

    .app-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 8px;
    }

    .app-title {
      font-size: 20px;
      font-weight: 700;
    }

    .header-buttons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-button {
      min-height: 36px;

      padding: 0 10px;

      border: none;
      border-radius: 8px;

      background: #f2f2f7;
      color: #007aff;

      font-size: 13px;
      font-weight: 600;
    }

    .logout-button {
      color: #ff3b30;
    }

    /* =================================================
       ナビゲーション
    ================================================= */

    .nav {
      display: flex;

      gap: 6px;

      padding: 8px 10px;

      background: #ffffff;

      border-bottom: 1px solid #d1d1d6;

      overflow-x: auto;

      -webkit-overflow-scrolling: touch;
    }

    .nav-button {
      flex-shrink: 0;

      min-height: 40px;

      padding: 0 14px;

      border: none;
      border-radius: 9px;

      background: #f2f2f7;
      color: #555;

      font-size: 14px;
      font-weight: 600;
    }

    .nav-button.active {
      background: #007aff;
      color: #ffffff;
    }

    /* =================================================
       ページ
    ================================================= */

    .page {
      padding: 12px;
    }

    /* =================================================
       勤務表
    ================================================= */

    .schedule-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 8px;

      margin-bottom: 10px;
    }

    .month-navigation {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .month-button {
      width: 42px;
      height: 40px;

      border: none;
      border-radius: 9px;

      background: #ffffff;
      color: #007aff;

      font-size: 20px;
      font-weight: 700;
    }

    .current-month {
      min-width: 110px;

      text-align: center;

      font-size: 18px;
      font-weight: 700;
    }

    .table-wrapper {
      width: 100%;

      overflow-x: auto;
      overflow-y: visible;

      touch-action: pan-x pan-y;

      -webkit-overflow-scrolling: touch;

      background: #ffffff;
      border-radius: 10px;
    }

    #scheduleTable {
      border-collapse: collapse;

      table-layout: fixed;

      background: #ffffff;
    }

    #scheduleTable th,
    #scheduleTable td {
      border: 1px solid #d1d1d6;

      text-align: center;

      padding: 0;

      height: 42px;

      font-size: 12px;
    }

    #scheduleTable th {
      background: #f2f2f7;
      font-weight: 700;
    }

    #scheduleTable .staff-header {
      width: 90px;
    }

    .staff-name-cell {
      width: 90px;

      background: #ffffff;

      font-weight: 700;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    /* =================================================
       固定レイヤー
    ================================================= */

    #scheduleFixedHeader {
      position: fixed;

      top: 0;
      left: 0;

      z-index: 900;

      pointer-events: none;

      overflow: hidden;

      background: transparent;
    }

    #scheduleFixedHeaderTable {
      border-collapse: collapse;

      table-layout: fixed;

      pointer-events: none;
    }

    #scheduleFixedHeaderTable th,
    #scheduleFixedHeaderTable td {
      border: 1px solid #d1d1d6;

      text-align: center;

      padding: 0;

      background: #f2f2f7;

      font-size: 12px;
      font-weight: 700;
    }

    #scheduleFixedStaffColumn {
      position: fixed;

      left: 0;

      z-index: 850;

      pointer-events: none;

      overflow: hidden;

      background: transparent;
    }

    #scheduleFixedStaffTable {
      border-collapse: collapse;

      table-layout: fixed;

      pointer-events: none;
    }

    #scheduleFixedStaffTable th,
    #scheduleFixedStaffTable td {
      border: 1px solid #d1d1d6;

      text-align: center;

      padding: 0;

      background: #ffffff;

      font-size: 12px;
    }

    /* =================================================
       リスト
    ================================================= */

    .list-container {
      background: #ffffff;

      border-radius: 12px;

      overflow: hidden;
    }

    .list-item {
      padding: 12px;

      border-bottom: 1px solid #e5e5ea;
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .list-item-title {
      font-size: 15px;
      font-weight: 600;
    }

    .list-button {
      min-height: 36px;

      padding: 0 12px;

      border: none;
      border-radius: 8px;

      background: #f2f2f7;
      color: #007aff;

      font-size: 13px;
      font-weight: 600;
    }

    .list-button.delete {
      color: #ff3b30;
    }

    /* =================================================
       フォーム
    ================================================= */

    .form-card {
      background: #ffffff;

      border-radius: 12px;

      padding: 16px;

      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;

      margin-bottom: 6px;

      font-size: 14px;
      font-weight: 600;
      color: #555;
    }

    .form-input,
    .form-select {
      width: 100%;

      min-height: 44px;

      padding: 0 12px;

      border: 1px solid #c7c7cc;
      border-radius: 9px;

      background: #ffffff;

      font-size: 16px;
    }

    .primary-button {
      width: 100%;

      min-height: 46px;

      border: none;
      border-radius: 10px;

      background: #007aff;
      color: #ffffff;

      font-size: 15px;
      font-weight: 700;
    }

    /* =================================================
       シフトメニュー
    ================================================= */

    #shiftMenu {
      position: fixed;

      display: none;

      z-index: 2000;

      background: #ffffff;

      border-radius: 12px;

      box-shadow:
        0 6px 25px rgba(0, 0, 0, 0.18);

      overflow: hidden;

      min-width: 160px;
    }

    .shift-menu-item {
      padding: 12px 16px;

      border-bottom: 1px solid #e5e5ea;

      font-size: 14px;
    }

    .shift-menu-item:last-child {
      border-bottom: none;
    }

    /* =================================================
       カレンダー確認
    ================================================= */

    #calendarConfirm {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 3000;

      background: rgba(0, 0, 0, 0.35);

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    #calendarConfirm > div {
      width: 100%;
      max-width: 360px;

      background: #ffffff;

      border-radius: 16px;

      padding: 20px;
    }

    /* =================================================
       スマートフォン
    ================================================= */

    @media (max-width: 600px) {

      .app-title {
        font-size: 18px;
      }

      .header-button {
        font-size: 12px;
        padding: 0 8px;
      }

      .page {
        padding: 8px;
      }

      #scheduleTable th,
      #scheduleTable td {
        font-size: 11px;
      }

    }

  </style>

</head>


<body>


  <!-- =================================================
       ログイン画面
  ================================================= -->

  <div
    id="loginPage"
    style="
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:#f2f2f7;
    "
  >

    <div
      style="
        width:100%;
        max-width:420px;
        background:#ffffff;
        border-radius:20px;
        padding:32px 24px;
        box-shadow:0 8px 30px rgba(0,0,0,0.08);
      "
    >

      <div
        style="
          text-align:center;
          font-size:48px;
          margin-bottom:12px;
        "
      >
        🗓️
      </div>

      <h1
        style="
          margin:0 0 28px;
          font-size:28px;
          text-align:center;
        "
      >
        勤務表
      </h1>


      <!-- 登録済み -->

      <div
        style="
          text-align:left;
          font-size:15px;
          font-weight:700;
          color:#333;
          margin-bottom:10px;
        "
      >
        登録済みの方
      </div>


      <button
        type="button"
        id="googleLoginButton"
        style="
          width:100%;
          min-height:52px;
          border:1px solid #d1d1d6;
          border-radius:12px;
          background:#ffffff;
          color:#1c1c1e;
          font-size:16px;
          font-weight:700;
          cursor:pointer;
          display:flex;
          align-items:center;
          justify-content:center;
          gap:10px;
        "
      >

        <span
          style="
            font-size:20px;
            font-weight:700;
          "
        >
          G
        </span>

        Googleでログイン

      </button>


      <!-- 区切り -->

      <div
        style="
          display:flex;
          align-items:center;
          gap:12px;
          margin:28px 0;
        "
      >

        <div
          style="
            flex:1;
            height:1px;
            background:#e5e5ea;
          "
        ></div>

        <span
          style="
            color:#999;
            font-size:13px;
          "
        >
          はじめての方
        </span>

        <div
          style="
            flex:1;
            height:1px;
            background:#e5e5ea;
          "
        ></div>

      </div>


      <!-- 新規登録ボタン -->

      <button
        type="button"
        id="newOrganizationButton"
        style="
          width:100%;
          min-height:52px;
          border:none;
          border-radius:12px;
          background:#007aff;
          color:#ffffff;
          font-size:16px;
          font-weight:700;
          cursor:pointer;
          box-sizing:border-box;
        "
      >
        職場を新規登録
      </button>


      <p
        style="
          margin:12px 0 0;
          color:#777;
          font-size:13px;
          line-height:1.6;
        "
      >
        はじめて勤務表を作成する方はこちら
      </p>


      <!-- =================================================
           新規職場登録フォーム
      ================================================= -->

      <div
        id="newOrganizationForm"
        style="
          display:none;
          margin-top:20px;
          text-align:left;
        "
      >

        <div
          style="
            font-size:15px;
            font-weight:700;
            color:#333;
            margin-bottom:10px;
          "
        >
          職場を新規登録
        </div>


        <label
          for="organizationNameInput"
          style="
            display:block;
            font-size:14px;
            color:#555;
            margin-bottom:6px;
          "
        >
          職場名
        </label>


        <input
          type="text"
          id="organizationNameInput"
          placeholder="例：○○学校"
          maxlength="100"
          style="
            width:100%;
            min-height:48px;
            padding:0 14px;
            border:1px solid #ccc;
            border-radius:10px;
            box-sizing:border-box;
            font-size:16px;
            outline:none;
            margin-bottom:12px;
          "
        >


        <button
          type="button"
          id="createOrganizationButton"
          style="
            width:100%;
            min-height:52px;
            border:none;
            border-radius:12px;
            background:#007aff;
            color:#ffffff;
            font-size:16px;
            font-weight:700;
            cursor:pointer;
            box-sizing:border-box;
          "
        >
          職場を登録する
        </button>


        <button
          type="button"
          id="cancelOrganizationButton"
          style="
            width:100%;
            min-height:44px;
            margin-top:8px;
            border:none;
            background:transparent;
            color:#007aff;
            font-size:14px;
            cursor:pointer;
          "
        >
          戻る
        </button>

      </div>


      <p
        id="loginMessage"
        style="
          margin:16px 0 0;
          min-height:24px;
          color:#666;
          font-size:14px;
        "
      ></p>

    </div>

  </div>


  <!-- =================================================
       アプリ本体
  ================================================= -->

  <div
    id="app"
    style="display:none;"
  >


    <!-- ヘッダー -->

    <header class="app-header">

      <div class="app-header-inner">

        <div class="app-title">
          勤務表
        </div>

        <div class="header-buttons">

          <button
            type="button"
            id="deleteMonthButton"
            class="header-button"
          >
            月消去
          </button>

          <button
            type="button"
            id="deleteFiscalYearButton"
            class="header-button"
          >
            年度消去
          </button>

          <button
            type="button"
            id="logoutButton"
            class="header-button logout-button"
          >
            ログアウト
          </button>

        </div>

      </div>

    </header>


    <!-- ナビ -->

    <nav class="nav">

      <button
        type="button"
        class="nav-button active"
        data-page="schedule"
      >
        勤務表
      </button>

      <button
        type="button"
        class="nav-button"
        data-page="staff"
      >
        職員管理
      </button>

      <button
        type="button"
        class="nav-button"
        data-page="leave"
      >
        休暇設定
      </button>

      <button
        type="button"
        class="nav-button"
        data-page="shift"
      >
        勤務形態
      </button>

      <button
        type="button"
        class="nav-button"
        data-page="holiday"
      >
        休業設定
      </button>

    </nav>


    <!-- =================================================
         勤務表ページ
    ================================================= -->

    <main>

      <section
        id="schedulePage"
        class="page"
      >

        <div class="schedule-controls">

          <div class="month-navigation">

            <button
              type="button"
              id="prevMonth"
              class="month-button"
            >
              ‹
            </button>

            <div
              id="currentMonth"
              class="current-month"
            >
            </div>

            <button
              type="button"
              id="nextMonth"
              class="month-button"
            >
              ›
            </button>

          </div>

        </div>


        <div class="table-wrapper">

          <table
            id="scheduleTable"
          >

            <!-- JavaScriptで生成 -->

          </table>

        </div>


        <!-- 固定ヘッダー -->

        <div
          id="scheduleFixedHeader"
          style="display:none;"
        >

          <table
            id="scheduleFixedHeaderTable"
          >
          </table>

        </div>


        <!-- 固定職員列 -->

        <div
          id="scheduleFixedStaffColumn"
          style="display:none;"
        >

          <table
            id="scheduleFixedStaffTable"
          >
          </table>

        </div>

      </section>


      <!-- =================================================
           職員管理
      ================================================= -->

      <section
        id="staffPage"
        class="page"
        style="display:none;"
      >

        <div class="form-card">

          <div class="form-group">

            <label
              class="form-label"
              for="staffNameInput"
            >
              職員名
            </label>

            <input
              type="text"
              id="staffNameInput"
              class="form-input"
              placeholder="職員名を入力"
            >

          </div>


          <button
            type="button"
            id="addStaffButton"
            class="primary-button"
          >
            職員を追加
          </button>

        </div>


        <div
          id="staffList"
          class="list-container"
        >
        </div>

      </section>


      <!-- =================================================
           休暇設定
      ================================================= -->

      <section
        id="leavePage"
        class="page"
        style="display:none;"
      >

        <div class="form-card">

          <div class="form-group">

            <label
              class="form-label"
              for="leaveNameInput"
            >
              休暇名
            </label>

            <input
              type="text"
              id="leaveNameInput"
              class="form-input"
              placeholder="例：年休"
            >

          </div>


          <div class="form-group">

            <label
              class="form-label"
              for="leaveColorInput"
            >
              色
            </label>

            <input
              type="color"
              id="leaveColorInput"
              value="#FFD54F"
              style="
                width:100%;
                height:44px;
                border:1px solid #ccc;
                border-radius:9px;
                background:#fff;
              "
            >

          </div>


          <button
            type="button"
            id="addLeaveButton"
            class="primary-button"
          >
            休暇を追加
          </button>

        </div>


        <div
          id="leaveList"
          class="list-container"
        >
        </div>

      </section>


      <!-- =================================================
           勤務形態
      ================================================= -->

      <section
        id="shiftPage"
        class="page"
        style="display:none;"
      >

        <div class="form-card">

          <div class="form-group">

            <label
              class="form-label"
              for="shiftNameInput"
            >
              勤務形態名
            </label>

            <input
              type="text"
              id="shiftNameInput"
              class="form-input"
              placeholder="例：早番"
            >

          </div>


          <div class="form-group">

            <label
              class="form-label"
              for="shiftStartInput"
            >
              開始時刻
            </label>

            <input
              type="time"
              id="shiftStartInput"
              class="form-input"
            >

          </div>


          <div class="form-group">

            <label
              class="form-label"
              for="shiftEndInput"
            >
              終了時刻
            </label>

            <input
              type="time"
              id="shiftEndInput"
              class="form-input"
            >

          </div>


          <div class="form-group">

            <label
              class="form-label"
              for="shiftBreakInput"
            >
              休憩
            </label>

            <input
              type="text"
              id="shiftBreakInput"
              class="form-input"
              placeholder="例：45分"
            >

          </div>


          <button
            type="button"
            id="addShiftButton"
            class="primary-button"
          >
            勤務形態を追加
          </button>

        </div>


        <div
          id="shiftList"
          class="list-container"
        >
        </div>

      </section>


      <!-- =================================================
           休業設定
      ================================================= -->

      <section
        id="holidayPage"
        class="page"
        style="display:none;"
      >

        <div class="form-card">

          <div class="form-group">

            <label
              class="form-label"
              for="holidayNameInput"
            >
              休業名
            </label>

            <input
              type="text"
              id="holidayNameInput"
              class="form-input"
              placeholder="例：夏季休業"
            >

          </div>


          <div class="form-group">

            <label
              class="form-label"
              for="holidayStartInput"
            >
              開始日
            </label>

            <input
              type="date"
              id="holidayStartInput"
              class="form-input"
            >

          </div>


          <div class="form-group">

            <label
              class="form-label"
              for="holidayEndInput"
            >
              終了日
            </label>

            <input
              type="date"
              id="holidayEndInput"
              class="form-input"
            >

          </div>


          <button
            type="button"
            id="addHolidayButton"
            class="primary-button"
          >
            休業を追加
          </button>

        </div>


        <div
          id="holidayList"
          class="list-container"
        >
        </div>

      </section>

    </main>


    <!-- =================================================
         シフトメニュー
    ================================================= -->

    <div
      id="shiftMenu"
    >
    </div>


    <!-- =================================================
         カレンダー確認
    ================================================= -->

    <div
      id="calendarConfirm"
    >

      <div>

        <div
