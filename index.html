<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>Shift+</title>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <meta
    name="theme-color"
    content="#f2f2f7"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Shift+"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>

  <!-- ==================================================
       ログイン画面専用
  ================================================== -->

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-width: 100%;
    }

    /* ==================================================
       ログイン画面
    ================================================== */

    #loginPage {
      position: fixed !important;

      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      left: 0 !important;

      width: 100vw !important;
      height: 100svh !important;

      min-height: 100svh !important;
      max-height: 100svh !important;

      margin: 0 !important;

      box-sizing: border-box !important;

      display: flex !important;

      align-items: center !important;
      justify-content: center !important;

      padding:
        max(8px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left)) !important;

      background: #f2f2f7 !important;

      overflow: hidden !important;

      overscroll-behavior: none !important;

      touch-action: none !important;
    }

    /* ==================================================
       ログインカード
    ================================================== */

    #loginPage > div {
      width: 100% !important;

      max-width: 390px !important;

      max-height:
        calc(
          100svh
          - env(safe-area-inset-top)
          - env(safe-area-inset-bottom)
          - 16px
        ) !important;

      padding: 18px 18px 14px !important;

      box-sizing: border-box !important;

      background: #ffffff !important;

      border-radius: 18px !important;

      box-shadow:
        0 2px 12px rgba(0,0,0,0.06) !important;

      overflow: hidden !important;

      flex-shrink: 1 !important;

      touch-action: none;
    }

    #loginPage button,
    #loginPage input,
    #loginPage label {
      touch-action: manipulation;
    }

    /* ==================================================
       Shift+ロゴ
    ================================================== */

    #loginPage #loginMainView > div:first-child {

      margin-top: 28px !important;

      margin-bottom: 28px !important;

      min-height: 130px !important;

      display: flex !important;

      justify-content: center !important;

      align-items: center !important;

      box-sizing: border-box !important;

      flex-shrink: 0 !important;
    }

    /* ==================================================
       招待登録画面
    ================================================== */

    #inviteRegisterView {
      width: 100%;
      box-sizing: border-box;
      text-align: left;
    }

    #inviteRegisterView .invite-register-title {
      margin: 0 0 16px;
      text-align: center;
      font-size: 21px;
      font-weight: 700;
      color: #222222;
    }

    .invite-social-title {

      display: flex;

      align-items: center;

      gap: 8px;

      margin: 16px 0 11px;
    }

    .invite-social-title-line {

      flex: 1;

      height: 1px;

      background: #e5e5ea;
    }

    .invite-social-title-text {

      color: #888888;

      font-size: 11px;

      white-space: nowrap;
    }

    .invite-social-buttons {

      display: flex;

      justify-content: center;

      align-items: flex-start;

      gap: 26px;

      margin-bottom: 5px;
    }

    #inviteGoogleButton svg {
      width: 22px;
      height: 22px;
    }

    #inviteAppleButton svg {
      width: 22px;
      height: 25px;
    }

    #inviteAzureButton svg {
      width: 22px;
      height: 22px;
    }

    #inviteRegisterMessage {

      margin: 8px 0 0;

      min-height: 16px;

      text-align: center;

      color: #666666;

      font-size: 12px;

      line-height: 1.5;
    }

    /* ==================================================
       ソーシャルログイン
    ================================================== */

    .social-login-button {

      width: 48px !important;
      height: 48px !important;

      min-width: 48px !important;
      min-height: 48px !important;

      border:
        1px solid #dedee2 !important;

      border-radius: 50% !important;

      background: #ffffff !important;

      color: #222222 !important;

      box-shadow: none !important;

      display: flex !important;

      align-items: center !important;
      justify-content: center !important;

      padding: 0 !important;
    }

    .social-login-button:active {
      background: #f5f5f7 !important;
    }

    /* ==================================================
       ソーシャルログイン名
    ================================================== */

    .social-login-label {

      margin-top: 5px;

      font-size: 11px;

      line-height: 1.2;

      color: #555555;

      white-space: nowrap;
    }

    /* ==================================================
       ソーシャルログイン全体
    ================================================== */

    .social-login-item {

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;
    }

    /* ==================================================
       Google
    ================================================== */

    #googleLoginButton svg,
    #inviteGoogleButton svg {
      width: 22px;
      height: 22px;
    }

    /* ==================================================
       Apple
    ================================================== */

    #appleLoginButton svg,
    #inviteAppleButton svg {

      width: 22px;
      height: 25px;
    }

    /* ==================================================
       Azure
    ================================================== */

    #azureLoginButton svg,
    #inviteAzureButton svg {

      width: 22px;
      height: 22px;
    }

    /* ==================================================
       Passkey
    ================================================== */

    #passkeyLoginButton {

      min-height: 44px !important;

      border:
        1px solid #b8b8bd !important;

      border-radius: 9px !important;

      background: #ffffff !important;

      color: #444444 !important;

      font-size: 14px !important;

      font-weight: 600 !important;

      box-shadow: none !important;
    }

    #passkeyLoginButton:active {
      background: #f5f5f7 !important;
    }

    /* ==================================================
       新規職場登録ボタン
    ================================================== */

    #newOrganizationButton {

      min-height: 44px !important;

      border:
        1px solid #b8b8bd !important;

      border-radius: 9px !important;

      background: #ffffff !important;

      color: #444444 !important;

      font-size: 14px !important;

      font-weight: 600 !important;

      box-shadow: none !important;
    }

    #newOrganizationButton:active {
      background: #f5f5f7 !important;
    }

    /* ==================================================
       新規登録画面
    ================================================== */

    #newOrganizationForm {
      max-height:
        calc(100svh - 50px);

      overflow: hidden !important;

      touch-action: none;
    }

    /* ==================================================
       アプリ画面
       Shift+ロゴ
    ================================================== */

    .app-header-brand {

      display: flex;

      align-items: center;

      gap: 8px;

      min-width: 0;

      flex-shrink: 1;
    }

    .app-header-logo {

      display: block;

      width: 72px;

      max-width: 72px;

      height: auto;

      object-fit: contain;

      flex-shrink: 0;
    }

    /* ==================================================
       勤務表ページ
    ================================================== */

    .schedule-brand {

  display: flex;

  flex-direction: column;

  align-items: flex-start;

  width: calc(100% + 10px);

  position: relative;

  left: -10px;

  padding:
    6px
    0
    2px;

  box-sizing: border-box;
}

    .schedule-logo {

      display: block;

      width: auto;

      height: 22px;

      max-width: 100px;

      object-fit: contain;

      flex-shrink: 0;
    }

    .schedule-organization-title {

      margin-top: 2px;

      font-size: 18px;

      font-weight: 600;

      line-height: 1.3;

      color: #333333;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      max-width: 100%;

      min-height: 23px;
    }

    /* ==================================================
       月送り
    ================================================== */

    #schedulePage .month-bar {

      width: 100%;

      box-sizing: border-box;

      display: flex;

      align-items: center;

      justify-content: center;
    }

    /* ==================================================
       小さい画面
    ================================================== */

    @media (max-height: 700px) {

      #loginPage > div {
        padding: 12px 16px 10px !important;
      }

      #loginPage #loginMainView > div:first-child {

        margin-top: 18px !important;

        margin-bottom: 18px !important;

        min-height: 100px !important;
      }

      #passkeyLoginButton,
      #newOrganizationButton {
        min-height: 40px !important;
      }

      .social-login-button {

        width: 44px !important;
        height: 44px !important;

        min-width: 44px !important;
        min-height: 44px !important;
      }

    }

    /* ==================================================
       非常に低い画面
    ================================================== */

    @media (max-height: 620px) {

      #loginPage > div {
        padding: 8px 14px 6px !important;
      }

      #loginPage #loginMainView > div:first-child {

        margin-top: 12px !important;

        margin-bottom: 12px !important;

        min-height: 75px !important;
      }

      #passkeyLoginButton,
      #newOrganizationButton {
        min-height: 37px !important;
      }

      .social-login-button {

        width: 40px !important;
        height: 40px !important;

        min-width: 40px !important;
        min-height: 40px !important;
      }

    }

    /* ==================================================
       さらに低い画面
    ================================================== */

    @media (max-height: 560px) {

      #loginPage > div {
        padding: 5px 12px 4px !important;
      }

      #loginPage #loginMainView > div:first-child {

        margin-top: 8px !important;

        margin-bottom: 8px !important;

        min-height: 55px !important;
      }

      #passkeyLoginButton,
      #newOrganizationButton {
        min-height: 34px !important;
      }

      .social-login-button {

        width: 36px !important;
        height: 36px !important;

        min-width: 36px !important;
        min-height: 36px !important;
      }

    }

    /* ==================================================
       スマートフォン
    ================================================== */

    @media (max-width: 600px) {

      .schedule-brand {
        padding:
          5px
          8px
          2px;
      }

      .schedule-logo {

        height: 20px;

        max-width: 92px;
      }

      .schedule-organization-title {

        font-size: 17px;

        min-height: 22px;
      }

    }

    /* ==================================================
       Shift+ ローディング画面
    ================================================== */

    #loadingScreen {

      position: fixed;

      inset: 0;

      z-index: 99999;

      display: none;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      background: #ffffff;

      color: #333333;

    }

    .loadingLogo {

      font-size: 38px;

      font-weight: 700;

      letter-spacing: 1px;

      margin-bottom: 18px;

    }

    .loadingLogo span {

      font-weight: 800;

    }

    .loadingDots {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      height: 20px;

    }

    .loadingDots span {

      width: 9px;

      height: 9px;

      border-radius: 50%;

      background: #007aff;

      animation:
        shiftLoadingDot
        1.2s
        infinite
        ease-in-out;

    }

    .loadingDots span:nth-child(1) {

      animation-delay: 0s;

    }

    .loadingDots span:nth-child(2) {

      animation-delay: 0.15s;

    }

    .loadingDots span:nth-child(3) {

      animation-delay: 0.30s;

    }

    @keyframes shiftLoadingDot {

      0%,
      60%,
      100% {

        transform: translateY(0);

        opacity: 0.35;

      }

      30% {

        transform: translateY(-7px);

        opacity: 1;

      }

    }

    .loadingText {

      margin-top: 12px;

      font-size: 14px;

      color: #777777;

    }

    body.dark-mode #loadingScreen {

      background: #111111;

      color: #ffffff;

    }

    body.dark-mode .loadingText {

      color: #aaaaaa;

    }

  </style>

</head>

<body>

<!-- ==================================================
     Shift+ ローディング画面
================================================== -->

<div id="loadingScreen">

  <div class="loadingLogo">
    Shift<span>+</span>
  </div>

  <div class="loadingDots">

    <span></span>
    <span></span>
    <span></span>

  </div>

  <div class="loadingText">
    読み込み中
  </div>

</div>

<!-- ==================================================
     ログイン画面
================================================== -->

<div
  id="loginPage"
  style="
    position:fixed;
    top:0;
    right:0;
    bottom:0;
    left:0;

    width:100vw;
    height:100svh;

    min-height:100svh;
    max-height:100svh;

    display:flex;

    align-items:center;
    justify-content:center;

    margin:0;

    padding:
      max(8px, env(safe-area-inset-top))
      max(10px, env(safe-area-inset-right))
      max(8px, env(safe-area-inset-bottom))
      max(10px, env(safe-area-inset-left));

    box-sizing:border-box;

    background:#f2f2f7;

    overflow:hidden;

    overscroll-behavior:none;

    touch-action:none;
  "
>

  <div
    style="
      width:100%;
      max-width:390px;

      max-height:calc(100svh - 20px);

      background:#ffffff;

      border-radius:18px;

      padding:18px 18px 14px;

      box-sizing:border-box;

      text-align:center;

      box-shadow:0 2px 12px rgba(0,0,0,0.06);

      overflow:hidden;
    "
  >

    <!-- ==================================================
         通常ログイン
    ================================================== -->

    <div id="loginMainView">

      <div
        style="
          margin-top:28px;

          margin-bottom:28px;

          min-height:130px;

          display:flex;

          justify-content:center;

          align-items:center;

          box-sizing:border-box;

          flex-shrink:0;
        "
      >

        <img
          src="./icons/shift-plus-logo.PNG"
          alt="Shift+"
          style="
            display:block;

            width:190px;

            max-width:65vw;

            height:auto;

            object-fit:contain;
          "
        >

      </div>

      <!-- ==================================================
           ソーシャルログイン
      ================================================== -->

      <div
        style="
          display:flex;

          align-items:center;

          gap:8px;

          margin:13px 0 10px;
        "
      >

        <div
          style="
            flex:1;

            height:1px;

            background:#e5e5ea;
          "
        ></div>

        <span
          style="
            color:#888;

            font-size:11px;

            white-space:nowrap;
          "
        >
          ログイン
        </span>

        <div
          style="
            flex:1;

            height:1px;

            background:#e5e5ea;
          "
        ></div>

      </div>

      <div
        style="
          display:flex;

          justify-content:center;

          align-items:flex-start;

          gap:26px;

          margin-bottom:11px;
        "
      >

        <!-- Google -->

        <div class="social-login-item">

          <button
            type="button"
            id="googleLoginButton"
            class="social-login-button"
            aria-label="Googleでログイン"
            title="Googleでログイン"
          >

            <svg
              width="22"
              height="22"
              viewBox="0 0 48 48"
              aria-hidden="true"
            >

              <path
                fill="#4285F4"
                d="M46.98 24.55c0-1.64-.15-3.22-.43-4.73H24v9.08h12.86c-.55 2.96-2.18 5.46-4.64 7.14l7.52 5.84C44.15 37.7 46.98 31.66 46.98 24.55z"
              />

              <path
                fill="#34A853"
                d="M24 48c6.48 0 11.92-2.14 15.9-5.82l-7.52-5.84c-2.08 1.4-4.73 2.23-8.38 2.23-6.28 0-11.57-3.57-13.48-8.78l-7.96 6.18C6.51 42.62 14.61 48 24 48z"
              />

              <path
                fill="#FBBC05"
                d="M10.52 28.4A14.47 14.47 0 0 1 9.5 24c0-1.53.26-3.02.73-4.4l-7.96-6.18A23.9 23.9 0 0 0 0 24c0 3.84.92 7.48 2.56 10.58l7.96-6.18z"
              />

              <path
                fill="#EA4335"
                d="M24 9.5c3.54 0 6.72 1.22 9.22 3.6l6.84-6.84C35.9 2.56 30.47 0 24 0 14.61 0 6.51 5.38 2.56 13.22l7.96 6.18C12.43 13.07 17.72 9.5 24 9.5z"
              />

            </svg>

          </button>

          <span class="social-login-label">
            Google
          </span>

        </div>

        <!-- Apple -->

        <div class="social-login-item">

          <button
            type="button"
            id="appleLoginButton"
            class="social-login-button"
            aria-label="Appleでログイン"
            title="Appleでログイン"
          >

            <svg
              width="22"
              height="25"
              viewBox="0 0 24 28"
              aria-hidden="true"
            >

              <path
                fill="#222222"
                d="M19.67 14.93c-.03-3.1 2.53-4.6 2.65-4.67-1.45-2.12-3.7-2.41-4.48-2.44-1.9-.2-3.74 1.13-4.7 1.13-.98 0-2.5-1.1-4.1-1.07-2.1.03-4.04 1.22-5.13 3.08-2.2 3.8-.56 9.39 1.55 12.47 1.03 1.5 2.24 3.16 3.84 3.1 1.54-.06 2.12-1 3.98-1 1.85 0 2.37 1 3.98.96 1.65-.03 2.69-1.5 3.68-3.01 1.16-1.74 1.64-3.42 1.67-3.5-.04-.01-3.2-1.22-3.24-5.05ZM16.58 5.81c.85-1.04 1.43-2.48 1.27-3.91-1.23.05-2.72.82-3.6 1.86-.79.91-1.48 2.38-1.3 3.78 1.38.1 2.78-.7 3.63-1.73Z"
              />

            </svg>

          </button>

          <span class="social-login-label">
            Apple
          </span>

        </div>

        <!-- Azure -->

        <div class="social-login-item">

          <button
            type="button"
            id="azureLoginButton"
            class="social-login-button"
            aria-label="Azureでログイン"
            title="Azureでログイン"
          >

            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <path
                d="M4 4h7l-4 16H3L4 4Z"
                fill="#555555"
              />

              <path
                d="M11 4h5l5 16h-6l-4-16Z"
                fill="#888888"
              />

              <path
                d="M8 16h8l2 4H7l1-4Z"
                fill="#444444"
              />

            </svg>

          </button>

          <span class="social-login-label">
            Azure
          </span>

        </div>

      </div>

      <!-- Passkey -->

      <button
        type="button"
        id="passkeyLoginButton"
        style="
          width:100%;

          min-height:44px;

          border:1px solid #b8b8bd;

          border-radius:9px;

          background:#ffffff;

          color:#444444;

          font-size:14px;

          font-weight:600;

          cursor:pointer;

          display:flex;

          align-items:center;

          justify-content:center;

          gap:8px;

          box-sizing:border-box;

          box-shadow:none;
        "
      >

        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path
            d="M7 8.5A5 5 0 0 1 17 8.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <path
            d="M5 11a7 7 0 0 1 14 0"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <path
            d="M8 13.5c0-2.2 1.8-4 4-4s4 1.8 4 4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <path
            d="M10 17c0-1.1.9-2 2-2s2 .9 2 2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <path
            d="M12 19.5v-1"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

        </svg>

        Face ID / 指紋でログイン

      </button>

      <p
        style="
          margin:4px 0 0;

          color:#888;

          font-size:10px;

          line-height:1.4;
        "
      >
        この端末に登録したFace ID・指紋などで<br>
        簡単にログインできます。
      </p>

      <div
        style="
          display:flex;

          align-items:center;

          gap:8px;

          margin:11px 0 8px;
        "
      >

        <div
          style="
            flex:1;

            height:1px;

            background:#e5e5ea;
          "
        ></div>

        <span
          style="
            color:#888;

            font-size:11px;

            white-space:nowrap;
          "
        >
          はじめての方
        </span>

        <div
          style="
            flex:1;

            height:1px;

            background:#e5e5ea;
          "
        ></div>

      </div>

      <button
        type="button"
        id="newOrganizationButton"
        style="
          width:100%;

          min-height:44px;

          border:1px solid #b8b8bd;

          border-radius:9px;

          background:#ffffff;

          color:#444444;

          font-size:14px;

          font-weight:600;

          cursor:pointer;

          box-sizing:border-box;

          box-shadow:none;
        "
      >
        職場を新規登録
      </button>

      <p
        style="
          margin:4px 0 0;

          color:#888;

          font-size:10px;

          line-height:1.4;
        "
      >
        はじめて勤務表を作成する方はこちら
      </p>

    </div>

    <!-- ==================================================
         招待リンク専用・職員登録画面
    ================================================== -->

    <div
      id="inviteRegisterView"
