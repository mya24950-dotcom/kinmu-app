<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>Shift+</title>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <meta
    name="theme-color"
    content="#f2f2f7"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Shift+"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>


  <!-- ==================================================
       ログイン画面専用
  ================================================== -->

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-width: 100%;
    }


    /* ==================================================
       ログイン画面
    ================================================== */

    #loginPage {
      position: fixed !important;

      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      left: 0 !important;

      width: 100vw !important;
      height: 100svh !important;

      min-height: 100svh !important;
      max-height: 100svh !important;

      margin: 0 !important;

      box-sizing: border-box !important;

      display: flex !important;

      align-items: center !important;
      justify-content: center !important;

      padding:
        max(8px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left)) !important;

      background: #f2f2f7 !important;

      overflow: hidden !important;

      overscroll-behavior: none !important;

      touch-action: none !important;
    }


    /* ==================================================
       ログインカード
    ================================================== */

    #loginPage > div {
      width: 100% !important;

      max-width: 390px !important;

      max-height:
        calc(
          100svh
          - env(safe-area-inset-top)
          - env(safe-area-inset-bottom)
          - 16px
        ) !important;

      padding: 18px 18px 14px !important;

      box-sizing: border-box !important;

      background: #ffffff !important;

      border-radius: 18px !important;

      box-shadow:
        0 2px 12px rgba(0,0,0,0.06) !important;

      overflow: hidden !important;

      flex-shrink: 1 !important;

      touch-action: none;
    }


    #loginPage button,
    #loginPage input,
    #loginPage label {
      touch-action: manipulation;
    }


    /* ==================================================
       Shift+ロゴ
    ================================================== */

    #loginPage #loginMainView > div:first-child {

      margin-top: 28px !important;

      margin-bottom: 28px !important;

      min-height: 130px !important;

      display: flex !important;

      justify-content: center !important;

      align-items: center !important;

      box-sizing: border-box !important;

      flex-shrink: 0 !important;
    }


    /* ==================================================
       招待登録画面
    ================================================== */

    #inviteRegisterView {
      width: 100%;
      box-sizing: border-box;
      text-align: left;
    }


    #inviteRegisterView .invite-register-title {
      margin: 0 0 16px;
      text-align: center;
      font-size: 21px;
      font-weight: 700;
      color: #222222;
    }


    .invite-social-title {

      display: flex;

      align-items: center;

      gap: 8px;

      margin: 16px 0 11px;
    }


    .invite-social-title-line {

      flex: 1;

      height: 1px;

      background: #e5e5ea;
    }


    .invite-social-title-text {

      color: #888888;

      font-size: 11px;

      white-space: nowrap;
    }


    .invite-social-buttons {

      display: flex;

      justify-content: center;

      align-items: flex-start;

      gap: 26px;

      margin-bottom: 5px;
    }


    #inviteGoogleButton svg {
      width: 22px;
      height: 22px;
    }


    #inviteAppleButton svg {
      width: 22px;
      height: 25px;
    }


    #inviteAzureButton svg {
      width: 22px;
      height: 22px;
    }


    #inviteRegisterMessage {

      margin: 8px 0 0;

      min-height: 16px;

      text-align: center;

      color: #666666;

      font-size: 12px;

      line-height: 1.5;
    }


    /* ==================================================
       ソーシャルログイン
    ================================================== */

    .social-login-button {

      width: 48px !important;
      height: 48px !important;

      min-width: 48px !important;
      min-height: 48px !important;

      border:
        1px solid #dedee2 !important;

      border-radius: 50% !important;

      background: #ffffff !important;

      color: #222222 !important;

      box-shadow: none !important;

      display: flex !important;

      align-items: center !important;
      justify-content: center !important;

      padding: 0 !important;
    }


    .social-login-button:active {
      background: #f5f5f7 !important;
    }


    .social-login-button.social-login-disabled,
    .social-login-button.social-login-disabled:disabled {
      background: #f1f1f3 !important;
      border-color: #d5d5d8 !important;
      color: #aaaaaa !important;
      opacity: 1 !important;
      cursor: default !important;
    }

    .social-login-coming-soon {
      display: block;
      margin-top: 2px;
      font-size: 9px;
      color: #aaaaaa;
    }

    .invite-email-register-area {
      margin-top: 16px;
      padding-top: 15px;
      border-top: 1px solid #e5e5ea;
    }

    .invite-email-register-title {
      margin: 0 0 12px;
      text-align: center;
      color: #666666;
      font-size: 12px;
    }


    /* ==================================================
       ソーシャルログイン名
    ================================================== */

    .social-login-label {

      margin-top: 5px;

      font-size: 11px;

      line-height: 1.2;

      color: #555555;

      white-space: nowrap;
    }


    /* ==================================================
       ソーシャルログイン全体
    ================================================== */

    .social-login-item {

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;
    }


    /* ==================================================
       Google
    ================================================== */

    #googleLoginButton svg,
    #inviteGoogleButton svg {
      width: 22px;
      height: 22px;
    }


    /* ==================================================
       Apple
    ================================================== */

    #appleLoginButton svg,
    #inviteAppleButton svg {

      width: 22px;
      height: 25px;
    }


    /* ==================================================
       Azure
    ================================================== */

    #azureLoginButton svg,
    #inviteAzureButton svg {

      width: 22px;
      height: 22px;
    }


    /* ==================================================
       Passkey
    ================================================== */

    #passkeyLoginButton {

      min-height: 44px !important;

      border:
        1px solid #b8b8bd !important;

      border-radius: 9px !important;

      background: #ffffff !important;

      color: #444444 !important;

      font-size: 14px !important;

      font-weight: 600 !important;

      box-shadow: none !important;
    }


    #passkeyLoginButton:active {
      background: #f5f5f7 !important;
    }


    /* ==================================================
       新規職場登録ボタン
    ================================================== */

    #newOrganizationButton {

      min-height: 44px !important;

      border:
        1px solid #b8b8bd !important;

      border-radius: 9px !important;

      background: #ffffff !important;

      color: #444444 !important;

      font-size: 14px !important;

      font-weight: 600 !important;

      box-shadow: none !important;
    }


    #newOrganizationButton:active {
      background: #f5f5f7 !important;
    }


    /* ==================================================
       新規登録画面
    ================================================== */

    #newOrganizationForm {
      max-height:
        calc(100svh - 50px);

      overflow: hidden !important;

      touch-action: none;
    }


    /* ==================================================
       アプリ画面
       Shift+ロゴ
    ================================================== */

    .app-header-brand {

      display: flex;

      align-items: center;

      gap: 8px;

      min-width: 0;

      flex-shrink: 1;
    }


    .app-header-logo {

      display: block;

      width: 72px;

      max-width: 72px;

      height: auto;

      object-fit: contain;

      flex-shrink: 0;
    }


    /* ==================================================
       勤務表ページ
    ================================================== */

    .schedule-brand {

      display: flex;

      flex-direction: column;

      align-items: flex-start;

      width: calc(100% + 10px);

      position: relative;

      left: -10px;

      padding:
        6px
        0
        2px;

      box-sizing: border-box;
    }


    .schedule-logo {

      display: block;

      width: auto;

      height: 22px;

      max-width: 100px;

      object-fit: contain;

      flex-shrink: 0;
    }


    .schedule-organization-title {

      margin-top: 2px;

      font-size: 18px;

      font-weight: 600;

      line-height: 1.3;

      color: #333333;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      max-width: 100%;

      min-height: 23px;
    }


    /* ==================================================
       ローディング画面
    ================================================== */

    #loadingScreen {

      position: fixed;

      inset: 0;

      z-index: 99999;

      display: none;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      background: #ffffff;

      color: #333333;
    }


    .loadingLogo {

      font-size: 38px;

      font-weight: 700;

      letter-spacing: 1px;

      margin-bottom: 18px;
    }


    .loadingLogo span {

      font-weight: 800;
    }


    .loadingDots {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      height: 20px;
    }


    .loadingDots span {

      width: 9px;

      height: 9px;

      border-radius: 50%;

      background: #007aff;

      animation:
        shiftLoadingDot
        1.2s
        infinite
        ease-in-out;
    }


    .loadingDots span:nth-child(1) {
      animation-delay: 0s;
    }


    .loadingDots span:nth-child(2) {
      animation-delay: 0.15s;
    }


    .loadingDots span:nth-child(3) {
      animation-delay: 0.30s;
    }


    @keyframes shiftLoadingDot {

      0%,
      60%,
      100% {

        transform: translateY(0);

        opacity: 0.35;
      }

      30% {

        transform: translateY(-7px);

        opacity: 1;
      }

    }


    .loadingText {

      margin-top: 12px;

      font-size: 14px;

      color: #777777;
    }


    body.dark-mode #loadingScreen {

      background: #111111;

      color: #ffffff;
    }


    body.dark-mode .loadingText {

      color: #aaaaaa;
    }


    /* ==================================================
       以下、元HTMLの既存CSS
    ================================================== */

    /* ここから下も削除・変更せず、そのまま使用 */

  </style>

</head>


<body>


<!-- ==================================================
     Shift+ ローディング画面
================================================== -->

<div id="loadingScreen">

  <div class="loadingLogo">
    Shift<span>+</span>
  </div>

  <div class="loadingDots">

    <span></span>
    <span></span>
    <span></span>

  </div>

  <div class="loadingText">
    読み込み中
  </div>

</div>


<!-- ==================================================
     ログイン画面
================================================== -->

<div
  id="loginPage"
  style="
    position:fixed;
    top:0;
    right:0;
    bottom:0;
    left:0;

    width:100vw;
    height:100svh;

    min-height:100svh;
    max-height:100svh;

    display:flex;

    align-items:center;
    justify-content:center;

    margin:0;

    padding:
      max(8px, env(safe-area-inset-top))
      max(10px, env(safe-area-inset-right))
      max(8px, env(safe-area-inset-bottom))
      max(10px, env(safe-area-inset-left));

    box-sizing:border-box;

    background:#f2f2f7;

    overflow:hidden;

    overscroll-behavior:none;

    touch-action:none;
  "
>


  <div
    style="
      width:100%;
      max-width:390px;

      max-height:calc(100svh - 20px);

      background:#ffffff;

      border-radius:18px;

      padding:18px 18px 14px;

      box-sizing:border-box;

      text-align:center;

      box-shadow:0 2px 12px rgba(0,0,0,0.06);

      overflow:hidden;
    "
  >


    <!-- ==================================================
         通常ログイン
    ================================================== -->

    <div id="loginMainView">


      <div
        style="
          margin-top:28px;

          margin-bottom:28px;

          min-height:130px;

          display:flex;

          justify-content:center;

          align-items:center;

          box-sizing:border-box;

          flex-shrink:0;
        "
      >

        <img
          src="./icons/shift-plus-logo.PNG"
          alt="Shift+"
          style="
            display:block;

            width:190px;

            max-width:65vw;

            height:auto;

            object-fit:contain;
          "
        >

      </div>


      <!-- ==================================================
           ソーシャルログイン
      ================================================== -->

      <div
        style="
          display:flex;

          align-items:center;

          gap:8px;

          margin:13px 0 10px;
        "
      >

        <div
          style="
            flex:1;

            height:1px;

            background:#e5e5ea;
          "
        ></div>

        <span
          style="
            color:#888;

            font-size:11px;

            white-space:nowrap;
          "
        >
          ログイン
        </span>

        <div
          style="
            flex:1;

            height:1px;

            background:#e5e5ea;
          "
        ></div>

      </div>


      <div
        style="
          display:flex;

          justify-content:center;

          align-items:flex-start;

          gap:26px;

          margin-bottom:11px;
        "
      >


        <!-- Google -->

        <div class="social-login-item">

          <button
            type="button"
            id="googleLoginButton"
            class="social-login-button"
            aria-label="Googleでログイン"
            title="Googleでログイン"
          >

            <svg
              width="22"
              height="22"
              viewBox="0 0 48 48"
              aria-hidden="true"
            >

              <path
                fill="#4285F4"
                d="M46.98 24.55c0-1.64-.15-3.22-.43-4.73H24v9.08h12.86c-.55 2.96-2.18 5.46-4.64 7.14l7.52 5.84C44.15 37.7 46.98 31.66 46.98 24.55z"
              />

              <path
                fill="#34A853"
                d="M24 48c6.48 0 11.92-2.14 15.9-5.82l-7.52-5.84c-2.08 1.4-4.73 2.23-8.38 2.23-6.28 0-11.57-3.57-13.48-8.78l-7.96 6.18C6.51 42.62 14.61 48 24 48z"
              />

              <path
                fill="#FBBC05"
                d="M10.52 28.4A14.47 14.47 0 0 1 9.5 24c0-1.53.26-3.02.73-4.4l-7.96-6.18A23.9 23.9 0 0 0 0 24c0 3.84.92 7.48 2.56 10.58l7.96-6.18z"
              />

              <path
                fill="#EA4335"
                d="M24 9.5c3.54 0 6.72 1.22 9.22 3.6l6.84-6.84C35.9 2.56 30.47 0 24 0 14.61 0 6.51 5.38 2.56 13.22l7.96 6.18C12.43 13.07 17.72 9.5 24 9.5z"
              />

            </svg>

          </button>

          <span class="social-login-label">
            Google
          </span>

        </div>


        <!-- Apple -->

        <div class="social-login-item">

          <button
            type="button"
            id="appleLoginButton"
            class="social-login-button social-login-disabled"
            disabled
            aria-label="Appleでログイン"
            title="Appleでログイン"
          >

            <svg
              width="22"
              height="25"
              viewBox="0 0 24 28"
              aria-hidden="true"
            >

              <path
                fill="#222222"
                d="M19.67 14.93c-.03-3.1 2.53-4.6 2.65-4.67-1.45-2.12-3.7-2.41-4.48-2.44-1.9-.2-3.74 1.13-4.7 1.13-.98 0-2.5-1.1-4.1-1.07-2.1.03-4.04 1.22-5.13 3.08-2.2 3.8-.56 9.39 1.55 12.47 1.03 1.5 2.24 3.16 3.84 3.1 1.54-.06 2.12-1 3.98-1 1.85 0 2.37 1 3.98.96 1.65-.03 2.69-1.5 3.68-3.01 1.16-1.74 1.64-3.42 1.67-3.5-.04-.01-3.2-1.22-3.24-5.05ZM16.58 5.81c.85-1.04 1.43-2.48 1.27-3.91-1.23.05-2.72.82-3.6 1.86-.79.91-1.48 2.38-1.3 3.78 1.38.1 2.78-.7 3.63-1.73Z"
              />

            </svg>

          </button>

          <span class="social-login-label">
            Apple
            <small class="social-login-coming-soon">追加予定</small>
          </span>

        </div>


        <!-- Azure -->

        <div class="social-login-item">

          <button
            type="button"
            id="azureLoginButton"
            class="social-login-button social-login-disabled"
            disabled
            aria-label="Azureでログイン"
            title="Azureでログイン"
          >

            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <path
                d="M4 4h7l-4 16H3L4 4Z"
                fill="#555555"
              />

              <path
                d="M11 4h5l5 16h-6l-4-16Z"
                fill="#888888"
              />

              <path
                d="M8 16h8l2 4H7l1-4Z"
                fill="#444444"
              />

            </svg>

          </button>

          <span class="social-login-label">
            Azure
            <small class="social-login-coming-soon">追加予定</small>
          </span>

        </div>

      </div>


      <!-- Passkey -->

      <button
        type="button"
        id="passkeyLoginButton"
        style="
          width:100%;

          min-height:44px;

          border:1px solid #b8b8bd;

          border-radius:9px;

          background:#ffffff;

          color:#444444;

          font-size:14px;

          font-weight:600;
        "
      >
        パスキーでログイン
      </button>


      <div
        style="
          display:flex;

          align-items:center;

          gap:8px;

          margin:16px 0 10px;
        "
      >

        <div
          style="
            flex:1;

            height:1px;

            background:#e5e5ea;
          "
        ></div>

        <span
          style="
            color:#888;

            font-size:11px;

            white-space:nowrap;
          "
        >
          メールアドレス
        </span>

        <div
          style="
            flex:1;

            height:1px;

            background:#e5e5ea;
          "
        ></div>

      </div>


      <div
        style="
          margin-bottom:9px;
          text-align:left;
        "
      >

        <input
          type="email"
          id="loginEmail"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="メールアドレス"
          style="
            width:100%;

            height:44px;

            box-sizing:border-box;

            padding:0 12px;

            border:1px solid #d9d9de;

            border-radius:9px;

            background:#ffffff;

            color:#222222;

            font-size:16px;

            outline:none;
          "
        >

      </div>


      <div
        style="
          position:relative;

          width:100%;

          margin-bottom:9px;

          text-align:left;
        "
      >

        <input
          type="password"
          id="loginPassword"
          autocomplete="current-password"
          placeholder="パスワード"
          style="
            width:100%;

            height:44px;

            box-sizing:border-box;

            padding:0 46px 0 12px;

            border:1px solid #d9d9de;

            border-radius:9px;

            background:#ffffff;

            color:#222222;

            font-size:16px;

            outline:none;
          "
        >

        <button
          type="button"
          id="togglePasswordButton"
          style="
            position:absolute;

            top:50%;

            right:4px;

            transform:translateY(-50%);

            width:38px;

            height:36px;

            border:0;

            background:transparent;

            color:#777777;

            font-size:18px;

            padding:0;
          "
          aria-label="パスワード表示切替"
        >
          👁
        </button>

      </div>


      <label
        style="
          display:flex;

          align-items:center;

          justify-content:flex-start;

          gap:7px;

          margin:2px 0 10px;

          color:#666;

          font-size:12px;
        "
      >

        <input
          type="checkbox"
          id="rememberLogin"
          style="
            width:16px;
            height:16px;
            margin:0;
          "
        >

        ログイン状態を保持

      </label>


      <button
        type="button"
        id="emailLoginButton"
        style="
          width:100%;

          min-height:44px;

          border:0;

          border-radius:10px;

          background:#222222;

          color:#ffffff;

          font-size:14px;

          padding:10px 14px;
        "
      >
        メールでログイン
      </button>


      <button
        type="button"
        id="forgotPasswordButton"
        style="
          width:100%;

          margin-top:7px;

          border:0;

          background:transparent;

          color:#666666;

          font-size:12px;

          padding:7px;
        "
      >
        パスワードを忘れた場合
      </button>


      <button
        type="button"
        id="newOrganizationButton"
        style="
          width:100%;

          min-height:44px;

          margin-top:4px;

          border:1px solid #b8b8bd;

          border-radius:9px;

          background:#ffffff;

          color:#444444;

          font-size:14px;

          font-weight:600;
        "
      >
        新しい職場を登録
      </button>


    </div>


    <!-- ==================================================
         メール登録画面
    ================================================== -->

    <div
      id="emailRegisterView"
      style="display:none;"
    >

      <button
        type="button"
        id="backToLoginFromRegisterButton"
        class="back-button"
      >
        ‹ ログインに戻る
      </button>


      <h2
        style="
          margin:8px 0 18px;

          font-size:20px;

          color:#222;
        "
      >
        メールアドレスで登録
      </h2>


      <div
        style="
          margin-bottom:12px;

          text-align:left;
        "
      >

        <label
          for="registerEmail"
          style="
            display:block;

  <script>

  (function() {

    function setupInviteRegisterView() {

        document.getElementById(
          "inviteAppleButton"
        );


      const azureButton =
        document.getElementById(

        );


      if (appleButton) {

        appleButton.disabled =
          true;

        appleButton.classList.add(
          "social-login-disabled"
        );

      }


      if (azureButton) {

        azureButton.disabled =
          true;

        azureButton.classList.add(
          "social-login-disabled"
        );

      }

    }


    /*
     * Google
     */
    function setupInviteGoogleButton() {

      const button =
        document.getElementById(
          "inviteGoogleButton"
        );


      if (!button) {

        return;

      }


      /*
       * 既存のGoogle招待登録処理を
       * script.js側で使用するため、
       * ここでは処理を上書きしない。
       */

    }


    /*
     * Apple / Azure
     */
    function setupInviteOtherButtons() {

      const appleButton =
        document.getElementById(
          "inviteAppleButton"
        );


      const azureButton =
        document.getElementById(
          "inviteAzureButton"
        );


      if (appleButton) {

        appleButton.disabled =
          true;

      }


      if (azureButton) {

        azureButton.disabled =
          true;

      }

    }


    /*
     * 各ボタンを設定
     */
    function setupInviteButtons() {

      setupInviteGoogleButton();

      setupInviteOtherButtons();

    }


    /*
     * 初期化
     */
    function initInviteScreen() {

      setupInviteRegisterView();

      setupInviteButtons();

    }


    if (
      document.readyState ===
      "loading"
    ) {

      document.addEventListener(
        "DOMContentLoaded",
        initInviteScreen
      );

    } else {

      initInviteScreen();

    }

  })();

  </script>


  <!-- ==================================================
       勤務表ページの職場名を同期
  ================================================== -->

  <script>

  (function() {


    function syncScheduleOrganizationTitle() {

      const source =
        document.getElementById(
          "organizationTitle"
        );


      const target =
        document.getElementById(
          "scheduleOrganizationTitle"
        );


      if (!source || !target) {

        return;

      }


      const text =
        source.textContent.trim();


      if (text) {

        target.textContent =
          text;

      }

    }


    function setupScheduleOrganizationTitle() {

      syncScheduleOrganizationTitle();


      const source =
        document.getElementById(
          "organizationTitle"
        );


      if (!source) {

        return;

      }


      const observer =
        new MutationObserver(
          function() {

            syncScheduleOrganizationTitle();

          }
        );


      observer.observe(
        source,
        {
          childList: true,
          characterData: true,
          subtree: true
        }
      );

    }


    if (
      document.readyState ===
      "loading"
    ) {

      document.addEventListener(
        "DOMContentLoaded",
        setupScheduleOrganizationTitle
      );

    } else {

      setupScheduleOrganizationTitle();

    }

  })();

  </script>
