<section
  id="leaveTypePage"
  class="page"
  style="display:none;"
>

  <div class="settings-card">

    <h2>📝 休暇種類</h2>

    <div class="leave-type-form">

      <input
        id="leaveTypeNameInput"
        type="text"
        placeholder="休暇種類名"
        autocomplete="off"
      >

      <div class="leave-type-color-row">

        <label for="leaveTypeColorInput">
          色
        </label>

        <input
          id="leaveTypeColorInput"
          type="color"
          value="#d9f2df"
        >

      </div>

      <button
        type="button"
        id="addLeaveTypeButton"
        class="add-button"
      >
        休暇種類を追加
      </button>

    </div>

    <p class="info">
      登録した休暇種類は勤務表の「休暇」から選択できます。
    </p>

    <div
      id="leaveTypeList"
      class="list"
    >
    </div>

  </div>

</section>
