<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#f5f5f7">

  <title>勤務表</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- =========================================
       ヘッダー
  ========================================== -->

  <header class="app-header">

    <div>
      <h1 class="app-title">勤務表</h1>
      <div
        id="appStatus"
        class="app-status"
      >
        起動中...
      </div>
    </div>

  </header>


  <!-- =========================================
       ナビゲーション
  ========================================== -->

  <nav class="nav">

    <button
      type="button"
      class="nav-button active"
      data-page="schedule"
    >
      📅 勤務表
    </button>

    <button
      type="button"
      class="nav-button"
      data-page="staff"
    >
      👤 職員
    </button>

    <button
      type="button"
      class="nav-button"
      data-page="shift"
    >
      🕐 勤務形態
    </button>

    <button
      type="button"
      class="nav-button"
      data-page="holiday"
    >
      🏖 休業日
    </button>

    <button
      type="button"
      class="nav-button"
      data-page="leaveType"
    >
      📝 休暇種類
    </button>

  </nav>


  <!-- =========================================
       メイン
  ========================================== -->

  <main>


    <!-- =======================================
         勤務表
    ======================================== -->

    <section
      id="schedulePage"
      class="page"
    >

      <div class="schedule-toolbar">

        <div class="month-navigation">

          <button
            type="button"
            id="prevMonth"
          >
            ‹
          </button>

          <div id="currentMonth">
            ----年--月
          </div>

          <button
            type="button"
            id="nextMonth"
          >
            ›
          </button>

        </div>


        <div class="toolbar-buttons">

          <button
            type="button"
            id="deleteMonthButton"
            class="toolbar-button danger"
          >
            今月削除
          </button>

          <button
            type="button"
            id="deleteFiscalYearButton"
            class="toolbar-button danger"
          >
            年度削除
          </button>

        </div>

      </div>


      <div class="schedule-wrapper">

        <table id="scheduleTable">

          <thead>
            <tr id="scheduleHeader">
            </tr>
          </thead>

          <tbody id="scheduleBody">
          </tbody>

        </table>

      </div>

    </section>



    <!-- =======================================
         職員管理
    ======================================== -->

    <section
      id="staffPage"
      class="page"
      style="display:none;"
    >

      <div class="settings-card">

        <h2>👤 職員管理</h2>


        <div class="form-row">

          <div class="form-group">

            <label for="staffNameInput">
              職員名
            </label>

            <input
              id="staffNameInput"
              type="text"
              placeholder="職員名を入力"
              autocomplete="off"
            >

          </div>


          <button
            type="button"
            id="addStaffButton"
            class="add-button"
          >
            職員を追加
          </button>

        </div>


        <div
          id="staffCount"
          class="info"
        >
          職員数：0人
        </div>


        <div
          id="staffList"
          class="list"
        >
        </div>

      </div>

    </section>



    <!-- =======================================
         勤務形態
    ======================================== -->

    <section
      id="shiftPage"
      class="page"
      style="display:none;"
    >

      <div class="settings-card">

        <h2>🕐 勤務形態</h2>


        <div class="form-row">

          <div class="form-group">

            <label for="shiftNameInput">
              勤務形態名
            </label>

            <input
              id="shiftNameInput"
              type="text"
              placeholder="例：早番"
              autocomplete="off"
            >

          </div>


          <div class="form-group">

            <label for="shiftStartInput">
              開始
            </label>

            <input
              id="shiftStartInput"
              type="time"
            >

          </div>


          <div class="form-group">

            <label for="shiftEndInput">
              終了
            </label>

            <input
              id="shiftEndInput"
              type="time"
            >

          </div>


          <div class="form-group">

            <label for="shiftBreakInput">
              休憩
            </label>

            <input
              id="shiftBreakInput"
              type="text"
              placeholder="例：60分"
              autocomplete="off"
            >

          </div>

        </div>


        <button
          type="button"
          id="addShiftButton"
          class="add-button"
        >
          勤務形態を追加
        </button>


        <div
          id="shiftList"
          class="list"
        >
        </div>

      </div>


      <!-- 明の時間 -->

      <div class="settings-card">

        <h2>🌅 「明」の時間設定</h2>

        <p class="info">
          宿直・夜勤などの翌日に表示する「明」の時間を設定します。
        </p>


        <div class="ake-time-row">

          <div class="form-group">

            <label for="akeStartInput">
              開始
            </label>

            <input
              id="akeStartInput"
              type="time"
              value="05:30"
            >

          </div>


          <div class="form-group">

            <label for="akeEndInput">
              終了
            </label>

            <input
              id="akeEndInput"
              type="time"
              value="11:15"
            >

          </div>


          <button
            type="button"
            id="saveAkeTimeButton"
            class="add-button"
          >
            保存
          </button>

        </div>

      </div>

    </section>



    <!-- =======================================
         休業日
    ======================================== -->

    <section
      id="holidayPage"
      class="page"
      style="display:none;"
    >

      <div class="settings-card">

        <h2>🏖 休業日</h2>


        <div class="form-row">

          <div class="form-group">

            <label for="companyHolidayName">
              休業日名
            </label>

            <input
              id="companyHolidayName"
              type="text"
              placeholder="例：年末年始"
              autocomplete="off"
            >

          </div>


          <div class="form-group">

            <label for="companyHolidayStart">
              開始日
            </label>

            <input
              id="companyHolidayStart"
              type="date"
            >

          </div>


          <div class="form-group">

            <label for="companyHolidayEnd">
              終了日
            </label>

            <input
              id="companyHolidayEnd"
              type="date"
            >

          </div>


          <button
            type="button"
            id="addCompanyHolidayButton"
            class="add-button"
          >
            休業日を追加
          </button>

        </div>


        <div
          id="companyHolidayList"
          class="list"
        >
        </div>

      </div>

    </section>



    <!-- =======================================
         休暇種類
    ======================================== -->

    <section
      id="leaveTypePage"
      class="page"
      style="display:none;"
    >

      <div class="settings-card">

        <h2>📝 休暇種類</h2>


        <div class="leave-type-form">

          <input
            id="leaveTypeNameInput"
            type="text"
            placeholder="休暇種類名"
            autocomplete="off"
          >


          <div class="leave-type-color-row">

            <label for="leaveTypeColorInput">
              色
            </label>

            <input
              id="leaveTypeColorInput"
              type="color"
              value="#d9f2df"
            >

          </div>


          <button
            type="button"
            id="addLeaveTypeButton"
            class="add-button"
          >
            休暇種類を追加
          </button>

        </div>


        <p class="info">
          登録した休暇種類は勤務表の「休暇」から選択できます。
        </p>


        <div
          id="leaveTypeList"
          class="list"
        >
        </div>

      </div>

    </section>

  </main>



  <!-- =========================================
       勤務選択メニュー
  ========================================== -->

  <div
    id="shiftMenu"
    class="shift-menu"
  >

    <div
      id="shiftMenuTitle"
      class="shift-menu-title"
    >
      勤務を選択
    </div>

    <div
      id="shiftMenuButtons"
      class="shift-menu-buttons"
    >
    </div>

  </div>



  <!-- =========================================
       休暇選択メニュー
  ========================================== -->

  <div
    id="leaveMenu"
    class="shift-menu"
  >

    <div
      id="leaveMenuTitle"
      class="shift-menu-title"
    >
      休暇を選択
    </div>

    <div
      id="leaveMenuButtons"
      class="shift-menu-buttons"
    >
    </div>

  </div>



  <!-- =========================================
       カレンダー確認
  ========================================== -->

  <div
    id="calendarConfirm"
    class="calendar-modal"
  >

    <div class="calendar-modal-content">

      <h3 id="calendarConfirmTitle">
        カレンダー
      </h3>

      <p id="calendarConfirmText">
        カレンダーに登録しますか？
      </p>


      <div class="calendar-modal-buttons">

        <button
          type="button"
          id="calendarCancelButton"
        >
          キャンセル
        </button>

        <button
          type="button"
          id="calendarOKButton"
        >
          カレンダー登録
        </button>

      </div>

    </div>

  </div>


  <!-- =========================================
       JavaScript
  ========================================== -->

  <script src="script.js"></script>

</body>
</html>
