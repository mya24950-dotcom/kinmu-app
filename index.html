<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Shift+"
  >

  <meta
    name="theme-color"
    content="#007aff"
  >

  <title>Shift+</title>


  <link
    rel="manifest"
    href="manifest.json"
  >


  <!-- ==================================================
       Supabase
  ================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"
  ></script>


  <!-- ==================================================
       ログイン画面CSS
  ================================================== -->

  <style>

    /* ==================================================
       ログイン画面全体
    ================================================== */

    #loginPage {

      position: fixed;

      inset: 0;

      z-index: 99999;

      display: flex;

      align-items: center;

      justify-content: center;

      min-height: 100vh;

      padding:
        24px;

      box-sizing: border-box;

      background:
        linear-gradient(
          180deg,
          #f7f9fc 0%,
          #eef3f8 100%
        );

      overflow-y: auto;

    }


    /* ==================================================
       ログインコンテナ
    ================================================== */

    .login-container {

      width: 100%;

      max-width: 420px;

      margin:
        auto;

      padding:
        28px 24px 32px;

      box-sizing: border-box;

      background:
        #ffffff;

      border-radius:
        20px;

      box-shadow:
        0 8px 30px
        rgba(0, 0, 0, .10);

    }


    /* ==================================================
       ロゴ
    ================================================== */

    .login-logo {

      display: block;

      width:
        180px;

      max-width:
        80%;

      height:
        auto;

      margin:
        0 auto 18px;

      object-fit:
        contain;

    }


    /* ==================================================
       ログインタイトル
    ================================================== */

    .login-title {

      margin:
        0 0 8px;

      text-align:
        center;

      font-size:
        24px;

      font-weight:
        700;

      color:
        #1c1c1e;

    }


    .login-subtitle {

      margin:
        0 0 24px;

      text-align:
        center;

      font-size:
        14px;

      line-height:
        1.6;

      color:
        #6e6e73;

    }


    /* ==================================================
       ログインボタン
    ================================================== */

    .login-button {

      display:
        block;

      width:
        100%;

      min-height:
        48px;

      margin:
        10px 0;

      padding:
        12px 16px;

      border:
        none;

      border-radius:
        12px;

      font-size:
        16px;

      font-weight:
        600;

      cursor:
        pointer;

      box-sizing:
        border-box;

      transition:
        opacity .15s ease,
        transform .05s ease;

    }


    .login-button:active {

      transform:
        scale(.99);

    }


    .login-button:hover {

      opacity:
        .92;

    }


    /* Google */

    #googleLoginButton {

      background:
        #ffffff;

      color:
        #1c1c1e;

      border:
        1px solid #d1d1d6;

    }


    /* Passkey */

    #passkeyLoginButton {

      background:
        #007aff;

      color:
        #ffffff;

    }


    /* メールログイン */

    #emailLoginButton {

      background:
        #34c759;

      color:
        #ffffff;

    }


    /* ==================================================
       区切り
    ================================================== */

    .login-divider {

      display:
        flex;

      align-items:
        center;

      gap:
        12px;

      margin:
        20px 0;

      color:
        #8e8e93;

      font-size:
        13px;

    }


    .login-divider::before,
    .login-divider::after {

      content:
        "";

      flex:
        1;

      height:
        1px;

      background:
        #d1d1d6;

    }


    /* ==================================================
       メール入力
    ================================================== */

    .login-input {

      display:
        block;

      width:
        100%;

      min-height:
        48px;

      margin:
        10px 0;

      padding:
        12px 14px;

      border:
        1px solid #c7c7cc;

      border-radius:
        10px;

      background:
        #ffffff;

      color:
        #1c1c1e;

      font-size:
        16px;

      box-sizing:
        border-box;

      outline:
        none;

    }


    .login-input:focus {

      border-color:
        #007aff;

      box-shadow:
        0 0 0 3px
        rgba(0,122,255,.12);

    }


    /* ==================================================
       メッセージ
    ================================================== */

    #loginMessage {

      min-height:
        22px;

      margin:
        12px 0;

      text-align:
        center;

      font-size:
        14px;

      line-height:
        1.5;

      color:
        #ff3b30;

    }


    /* ==================================================
       新規職場登録
    ================================================== */

    #newOrganizationButton {

      display:
        block;

      width:
        100%;

      margin:
        18px 0 0;

      padding:
        12px;

      border:
        none;

      background:
        transparent;

      color:
        #007aff;

      font-size:
        15px;

      font-weight:
        600;

      cursor:
        pointer;

    }


    #newOrganizationForm {

      display:
        none;

      margin-top:
        20px;

      padding-top:
        20px;

      border-top:
        1px solid #d1d1d6;

    }


    .organization-form-title {

      margin:
        0 0 14px;

      font-size:
        18px;

      font-weight:
        700;

      text-align:
        center;

      color:
        #1c1c1e;

    }


    .organization-input {

      display:
        block;

      width:
        100%;

      min-height:
        46px;

      margin:
        8px 0;

      padding:
        11px 13px;

      border:
        1px solid #c7c7cc;

      border-radius:
        10px;

      font-size:
        16px;

      box-sizing:
        border-box;

    }


    .organization-form-note {

      margin:
        10px 0;

      font-size:
        13px;

      line-height:
        1.5;

      color:
        #6e6e73;

    }


    #createOrganizationButton {

      display:
        block;

      width:
        100%;

      min-height:
        48px;

      margin:
        12px 0 8px;

      border:
        none;

      border-radius:
        12px;

      background:
        #007aff;

      color:
        #ffffff;

      font-size:
        16px;

      font-weight:
        600;

      cursor:
        pointer;

    }


    #cancelOrganizationButton {

      display:
        block;

      width:
        100%;

      padding:
        10px;

      border:
        none;

      background:
        transparent;

      color:
        #007aff;

      font-size:
        15px;

      cursor:
        pointer;

    }


    /* ==================================================
       招待登録画面
    ================================================== */

    #inviteRegisterView {

      display:
        none;

    }


    #loginMainView {

      display:
        block;

    }


    .invite-title {

      margin:
        0 0 12px;

      text-align:
        center;

      font-size:
        21px;

      font-weight:
        700;

    }


    .invite-text {

      margin:
        0 0 18px;

      text-align:
        center;

      font-size:
        14px;

      line-height:
        1.6;

      color:
        #6e6e73;

    }


    /* ==================================================
       スマートフォン
    ================================================== */

    @media (
      max-width: 600px
    ) {

      #loginPage {

        align-items:
          flex-start;

        padding:
          16px;

      }


      .login-container {

        margin-top:
          20px;

        padding:
          24px 18px 28px;

        border-radius:
          16px;

      }


      .login-logo {

        width:
          150px;

      }


      .login-title {

        font-size:
          22px;

      }

    }

  </style>

</head>

      ================================================== -->

      <div

        <h2

          職員招待
        </h2>


        <p

          招待を受けています。<br>

        <button

          type="button"

          Googleで登録・ログイン
        </button>


        <div

        >
          または
        </div>


        <input
          id="inviteEmailInput"
          class="login-input"

          placeholder="メールアドレス"

        >


        <input
          id="invitePasswordInput"
          class="login-input"
          type="password"

        >


        <button

  <!-- ==================================================
       招待処理・職場名同期
  ================================================== -->

  <script>

    /* ==================================================
       招待トークン
    ================================================== */

    function getInviteToken() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      return params.get(
        "invite"
      );

    }


    /* ==================================================
       招待登録画面
    ================================================== */

    function setupInviteRegisterView() {

      const token =
        getInviteToken();

      const main =
        document.getElementById(
          "loginMainView"
        );

      const invite =
        document.getElementById(
          "inviteRegisterView"
        );

      if (
        token &&
        main &&
        invite
      ) {

        main.style.display =
          "none";

        invite.style.display =
          "block";

      }

    }


    /* ==================================================
       招待 Google
    ================================================== */

    function setupInviteGoogleButton() {

      const button =
        document.getElementById(
          "inviteGoogleButton"
        );

      if (!button) {

        return;

      }


      button.onclick =
        function () {

          if (
            typeof loginWithGoogle ===
            "function"
          ) {

            loginWithGoogle();

          }

        };

    }


    /* ==================================================
       招待 メール
    ================================================== */

    function setupInviteEmailButton() {

      const button =
        document.getElementById(
          "inviteEmailButton"
        );


      if (!button) {

        return;

      }


      button.onclick =
        async function () {

          const email =
            document.getElementById(
              "inviteEmailInput"
            )?.value.trim();


          const password =

    function syncScheduleOrganizationTitle() {

      const headerTitle =
        document.getElementById(
          "organizationTitle"
        );

      const scheduleTitle =
        document.getElementById(
          "scheduleOrganizationTitle"
        );


      if (
        !scheduleTitle
      ) {

        return;

      }


      if (
        headerTitle
      ) {

        scheduleTitle.textContent =
          headerTitle.textContent || "";

      }

    }


    function setupScheduleOrganizationTitle() {

      syncScheduleOrganizationTitle();

      const observer =
        new MutationObserver(
          function () {

            syncScheduleOrganizationTitle();

          }
        );


      const title =
        document.getElementById(
          "organizationTitle"
        );


      if (title) {

        observer.observe(
          title,
          {
            childList: true,
            characterData: true,
            subtree: true
          }
        );

      }

    }


    document.addEventListener(
      "DOMContentLoaded",
      setupScheduleOrganizationTitle
    );
