
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>勤務表</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e5e5e5;
    }

    #pdfViewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #e5e5e5;
      touch-action: none;
      user-select: none;
    }

    #pdfContainer {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    .pdf-page {
      display: block;
      background: white;
      margin-bottom: 8px;
    }

    #message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
    }
  </style>
</head>

<body>

<div id="pdfViewport">
  <div id="pdfContainer"></div>
  <div id="message">勤務表を読み込んでいます...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const viewportElement = document.getElementById("pdfViewport");
const container = document.getElementById("pdfContainer");
const message = document.getElementById("message");

let pdfDocument = null;

let baseScale = 1;
let zoom = 1;

let posX = 0;
let posY = 0;

let pageTasks = [];
let pointers = new Map();

let startDistance = 0;
let startZoom = 1;
let startX = 0;
let startY = 0;

let pinchCenterX = 0;
let pinchCenterY = 0;

let renderTimer = null;
let renderId = 0;
let isPinching = false;

const MAX_ZOOM = 5;
const MIN_ZOOM = 1;

// PDF読み込み
async function showPdf() {

  const params = new URLSearchParams(location.search);
  const month = Number(params.get("month"));

  if (!Number.isInteger(month) || month < 1 || month > 12) {
    message.textContent = "月の指定が正しくありません。";
    return;
  }

  const fileName = `勤務表${month}月.pdf`;
  const pdfUrl = "./" + encodeURIComponent(fileName) + "?v=" + Date.now();

  try {
    pdfDocument = await pdfjsLib.getDocument(pdfUrl).promise;
    message.style.display = "none";
    await fitToScreen();
  } catch (error) {
    console.error(error);
    message.textContent = "PDFを表示できませんでした。";
  }
}

// 画面に合わせる
async function fitToScreen() {

  if (!pdfDocument) return;

  const page = await pdfDocument.getPage(1);
  const original = page.getViewport({ scale: 1 });

  const screenWidth = viewportElement.clientWidth;
  const screenHeight = viewportElement.clientHeight;

  baseScale = Math.min(
    screenWidth / original.width,
    screenHeight / original.height
  );

  zoom = 1;

  const pageWidth = original.width * baseScale;
  const pageHeight = original.height * baseScale;

  posX = (screenWidth - pageWidth) / 2;
  posY = (screenHeight - pageHeight) / 2;

  await renderPages();
}

// 高解像度PDF描画
async function renderPages() {

  if (!pdfDocument) return;

  const thisRenderId = ++renderId;

  pageTasks.forEach(task => {
    try {
      task.cancel();
    } catch (e) {}
  });

  pageTasks = [];
  container.innerHTML = "";

  const scale = baseScale * zoom;

  const pixelRatio = Math.min(
    window.devicePixelRatio || 1,
    3
  );

  let top = 0;
  let maxWidth = 0;

  for (let pageNumber = 1; pageNumber <= pdfDocument.numPages; pageNumber++) {

    if (thisRenderId !== renderId) return;

    const page = await pdfDocument.getPage(pageNumber);
    const pdfViewport = page.getViewport({ scale });

    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d", { alpha: false });

    canvas.className = "pdf-page";

    canvas.width = Math.ceil(pdfViewport.width * pixelRatio);
    canvas.height = Math.ceil(pdfViewport.height * pixelRatio);

    canvas.style.width = pdfViewport.width + "px";
    canvas.style.height = pdfViewport.height + "px";
    canvas.style.marginBottom = "8px";

    container.appendChild(canvas);

    const task = page.render({
      canvasContext: context,
      viewport: pdfViewport,
      transform: [
        pixelRatio, 0,
        0, pixelRatio,
        0, 0
      ]
    });

    pageTasks.push(task);

    try {
      await task.promise;
    } catch (error) {
      if (error.name === "RenderingCancelledException") return;
      throw error;
    }

    maxWidth = Math.max(maxWidth, pdfViewport.width);
    top += pdfViewport.height + 8;
  }

  if (thisRenderId !== renderId) return;

  container.style.width = maxWidth + "px";
  container.style.height = top + "px";

  updatePosition();
}

// 表示位置更新
function updatePosition() {
  container.style.transform =
    `translate3d(${posX}px, ${posY}px, 0) scale(1)`;
}

// 操作中の仮拡大
function previewZoom(value, centerX, centerY) {

  const newZoom = Math.max(
    MIN_ZOOM,
    Math.min(MAX_ZOOM, value)
  );

  const ratio = newZoom / zoom;

  posX = centerX - (centerX - posX) * ratio;
  posY = centerY - (centerY - posY) * ratio;

  zoom = newZoom;

  updatePosition();
}

// ピンチ開始
viewportElement.addEventListener("pointerdown", event => {

  viewportElement.setPointerCapture(event.pointerId);

  pointers.set(event.pointerId, {
    x: event.clientX,
    y: event.clientY
  });

  if (pointers.size === 2) {

    const points = [...pointers.values()];

    startDistance = getDistance(points[0], points[1]);
    startZoom = zoom;

    pinchCenterX = (points[0].x + points[1].x) / 2;
    pinchCenterY = (points[0].y + points[1].y) / 2;

    startX = posX;
    startY = posY;

    isPinching = true;
  }
});

// ピンチ操作
viewportElement.addEventListener("pointermove", event => {

  if (!pointers.has(event.pointerId)) return;

  const previous = pointers.get(event.pointerId);

  pointers.set(event.pointerId, {
    x: event.clientX,
    y: event.clientY
  });

  if (pointers.size === 2) {

    const points = [...pointers.values()];

    const distance = getDistance(points[0], points[1]);

    const centerX = (points[0].x + points[1].x) / 2;
    const centerY = (points[0].y + points[1].y) / 2;

    const ratio = distance / startDistance;

    const newZoom = Math.max(
      MIN_ZOOM,
      Math.min(MAX_ZOOM, startZoom * ratio)
    );

    const scaleRatio = newZoom / startZoom;

    posX = centerX - (centerX - startX) * scaleRatio;
    posY = centerY - (centerY - startY) * scaleRatio;

    zoom = newZoom;

    // Canvasを再描画せず滑らかに拡大
    const previewScale = zoom / startZoom;

    container.style.transformOrigin = "0 0";

    container.style.transform =
      `translate3d(${posX}px, ${posY}px, 0) scale(${previewScale})`;

  } else if (pointers.size === 1 && zoom > 1 && !isPinching) {

    posX += event.clientX - previous.x;
    posY += event.clientY - previous.y;

    updatePosition();
  }
});

// 2点間の距離
function getDistance(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

// 指を離したとき
function pointerEnd(event) {

  pointers.delete(event.pointerId);

  if (isPinching && pointers.size < 2) {

    isPinching = false;

    // 操作終了後に高解像度で描き直す
    clearTimeout(renderTimer);

    renderTimer = setTimeout(() => {
      renderPages();
    }, 180);
  }

  if (pointers.size === 1) {
    const point = [...pointers.values()][0];
    startX = point.x;
    startY = point.y;
  }
}

viewportElement.addEventListener("pointerup", pointerEnd);
viewportElement.addEventListener("pointercancel", pointerEnd);

// 画面回転時
window.addEventListener("resize", () => {
  if (pdfDocument) {
    fitToScreen();
  }
});

// 開始
showPdf();

</script>
</body>
</html>
