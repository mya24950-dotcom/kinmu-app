
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>勤務表</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #e5e5e5;
    }

    body {
      padding: 10px;
    }

    #pdfContainer {
      width: 100%;
      margin: 0 auto;
    }

    .pdf-page {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 10px;
      background: white;
    }

    #message {
      text-align: center;
      padding: 30px;
      color: #555;
    }

    /* スマホ横向き */
    @media screen and (orientation: landscape) and (max-height: 600px) {
      body {
        padding: 0;
        background: white;
      }

      #pdfContainer {
        width: 100%;
        max-width: none;
      }

      .pdf-page {
        margin: 0 auto;
        box-shadow: none;
      }
    }

    /* スマホ縦向き */
    @media screen and (max-width: 600px) and (orientation: portrait) {
      body {
        padding: 0;
        background: white;
      }

      #pdfContainer {
        width: 100%;
      }

      .pdf-page {
        margin-bottom: 8px;
      }
    }
  </style>
</head>

<body>

  <div id="pdfContainer">
    <div id="message">勤務表を読み込んでいます...</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let currentPdf = null;
    let rendering = false;

    async function showPdf() {
      const params = new URLSearchParams(location.search);
      const month = Number(params.get("month"));

      const container = document.getElementById("pdfContainer");

      if (!Number.isInteger(month) || month < 1 || month > 12) {
        container.innerHTML =
          '<div id="message">月の指定が正しくありません。</div>';
        return;
      }

      const fileName = `勤務表${month}月.pdf`;

      const pdfUrl =
        "./" + encodeURIComponent(fileName) +
        "?v=" + Date.now();

      try {
        currentPdf = await pdfjsLib.getDocument(pdfUrl).promise;
        await renderPages();
      } catch (error) {
        console.error(error);
        container.innerHTML =
          '<div id="message">PDFを表示できませんでした。ファイル名や保存場所を確認してください。</div>';
      }
    }

    async function renderPages() {
      if (!currentPdf || rendering) return;

      rendering = true;

      const container = document.getElementById("pdfContainer");
      container.innerHTML = "";

      try {
        for (
          let pageNumber = 1;
          pageNumber <= currentPdf.numPages;
          pageNumber++
        ) {
          const page = await currentPdf.getPage(pageNumber);

          const originalViewport = page.getViewport({ scale: 1 });

          // 画面幅いっぱいに表示
          const availableWidth = container.clientWidth || window.innerWidth;

          const scale = availableWidth / originalViewport.width;

          const viewport = page.getViewport({ scale });

          // 高解像度描画
          const pixelRatio = Math.min(
            Math.max(window.devicePixelRatio || 1, 3),
            4
          );

          const canvas = document.createElement("canvas");
          const context = canvas.getContext("2d");

          canvas.className = "pdf-page";

          canvas.width = Math.ceil(viewport.width * pixelRatio);
          canvas.height = Math.ceil(viewport.height * pixelRatio);

          canvas.style.width = "100%";
          canvas.style.height = "auto";

          container.appendChild(canvas);

          await page.render({
            canvasContext: context,
            viewport: viewport,
            transform: [
              pixelRatio, 0,
              0, pixelRatio,
              0, 0
            ]
          }).promise;
        }
      } catch (error) {
        console.error(error);
        container.innerHTML =
          '<div id="message">勤務表の描画に失敗しました。</div>';
      } finally {
        rendering = false;
      }
    }

    showPdf();
  </script>

</body>
</html>
