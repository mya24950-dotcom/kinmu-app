
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>勤務表PDF</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #e5e5e5;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
    }

    #pdfViewer {
      display: block;
      width: min(100%, 794px);
      height: calc(100vh - 32px);
      min-height: 500px;
      border: none;
      background: white;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
        background: white;
      }

      #pdfViewer {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        box-shadow: none;
      }
    }
  </style>
</head>

<body>
  <iframe id="pdfViewer"></iframe>

  <script>
    const params = new URLSearchParams(location.search);
    const month = Number(params.get("month"));

    if (Number.isInteger(month) && month >= 1 && month <= 12) {
      const fileName = `勤務表${month}月.pdf`;

      document.getElementById("pdfViewer").src =
        "./" + encodeURIComponent(fileName) + "#view=Fit";
    } else {
      document.body.textContent = "月の指定が正しくありません。";
    }
  </script>
</body>
</html>
