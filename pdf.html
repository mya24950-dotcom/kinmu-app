
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>勤務表PDF</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #e5e5e5;
    }

    body {
      padding: 20px;
    }

    #pdfContainer {
      width: 100%;
      max-width: 794px;
      margin: 0 auto;
    }

    .pdf-page {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 20px;
      background: white;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    #message {
      text-align: center;
      padding: 30px;
      color: #555;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
        background: white;
      }

      #pdfContainer {
        max-width: 100%;
      }

      .pdf-page {
        margin-bottom: 8px;
        box-shadow: none;
      }
    }
  </style>
</head>

<body>

  <div id="pdfContainer">
    <div id="message">勤務表を読み込んでいます...</div>
  </div>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    async function showPdf() {
      const params = new URLSearchParams(location.search);
      const month = Number(params.get("month"));

      const container = document.getElementById("pdfContainer");
      const message = document.getElementById("message");

      if (!Number.isInteger(month) || month < 1 || month > 12) {
        message.textContent = "月の指定が正しくありません。";
        return;
      }

      const fileName = `勤務表${month}月.pdf`;

      const pdfUrl =
        "./" + encodeURIComponent(fileName) +
        "?v=" + Date.now();

      try {
        const pdf = await pdfjsLib.getDocument(pdfUrl).promise;

        container.innerHTML = "";

        const maxWidth = Math.min(
          container.clientWidth || window.innerWidth,
          794
        );

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          const page = await pdf.getPage(pageNumber);

          const originalViewport = page.getViewport({ scale: 1 });

          const scale = maxWidth / originalViewport.width;

          const viewport = page.getViewport({ scale });

          // 高解像度で描画（最大4倍）
          const pixelRatio = Math.min(
            Math.max(window.devicePixelRatio || 1, 3),
            4
          );

          const canvas = document.createElement("canvas");
          const context = canvas.getContext("2d");

          canvas.className = "pdf-page";

          canvas.width = Math.floor(viewport.width * pixelRatio);
          canvas.height = Math.floor(viewport.height * pixelRatio);

          canvas.style.width = viewport.width + "px";
          canvas.style.height = viewport.height + "px";

          container.appendChild(canvas);

          await page.render({
            canvasContext: context,
            viewport: viewport,
            transform: [pixelRatio, 0, 0, pixelRatio, 0, 0]
          }).promise;
        }

      } catch (error) {
        console.error(error);
        container.innerHTML =
          '<div id="message">PDFを表示できませんでした。ファイル名や保存場所を確認してください。</div>';
      }
    }

    showPdf();
  </script>

</body>
</html>
